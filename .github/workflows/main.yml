name: Build Llama Music Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract Llama.zip
      run: |
        if [ -f "Llama.zip" ]; then
          echo "Found Llama.zip, extracting..."
          unzip -o Llama.zip
          rm Llama.zip
        fi
        
        if [ -d "Llama" ]; then
          mv Llama/* .
          rm -rf Llama
        fi
        
        echo "Files after extraction:"
        ls -la
    
    - name: Make gradlew executable (if exists)
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK
      run: |
        yes | sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
    
    - name: Verify CMake
      run: cmake --version
    
    - name: Build APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleRelease
        else
          # Create gradle wrapper if missing
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: llama-music-player-apk
        path: app/build/outputs/apk/release/*.apk
