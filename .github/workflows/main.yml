# ============================================================================
# Llama Music Player - GitHub Actions Workflow
# ============================================================================
# Builds the Llama Music Player APK from llama_music_player.zip.
# Target stack: SDK 35 (Android 15), AGP 8.2.2, Gradle 8.2, Java 17.
#
# Faithful presentation
# ----------------------------------------------------------------------------
# The compiler must read exactly the files that were approved. Two
# hashes enforce that, and nothing else:
#
#   1. llama_music_player.zip.sha256 — the archive's identity. Catches
#      a wrong or stale zip before extraction.
#
#   2. gradle-files.sha256 — the SHA-256 of every file Gradle reads,
#      compared against the extracted tree. Catches any difference
#      between the bytes that came out of the archive and the bytes
#      that were approved, including a different zip with the right
#      name, a BOM, a line-ending change, a truncation, or a swap.
#
# Both checks compare whole files. Neither inspects line endings,
# encodings, or archive layout. A file either equals the approved
# bytes or it does not.
#
# No step modifies a Gradle file between extraction and compilation.
# The manifest check reads and exits. local.properties is written only
# after the manifest check passes, and is not part of the manifest
# because Gradle does not compile it.
#
# Permissions
# ----------------------------------------------------------------------------
# The archive is treated as a carrier of file content, not of file
# mode. unzip applies the archive's stored modes to the extracted
# tree, which can leave a directory unreadable to the runner and
# break the very first traversal. Permissions are repaired top-down:
# each level is made traversable before the next is entered, so no
# tool ever needs to enter a directory it cannot read. The workspace
# is then normalized: directories 755, regular files 644, and the
# two executables (gradlew, gradle-wrapper.jar) 755. No stored mode
# from the archive survives to the build.
#
# Source archive refresh
# ----------------------------------------------------------------------------
#     zip -r -X llama_music_player.zip <source paths>
#     sha256sum llama_music_player.zip > llama_music_player.zip.sha256
#     sha256sum build.gradle settings.gradle gradle.properties \
#       gradle/wrapper/gradle-wrapper.properties app/build.gradle \
#       > gradle-files.sha256
#     git add llama_music_player.zip llama_music_player.zip.sha256 \
#       gradle-files.sha256
#     git commit -m "Refresh archive and manifest"
#     git push
#
# Build mode
# ----------------------------------------------------------------------------
#   use_cache = false  -> ./gradlew clean assemble<Type>  (default, fresh)
#   use_cache = true   -> ./gradlew assemble<Type>        (cache reused)
#
# Signing
# ----------------------------------------------------------------------------
# Release builds require llama_release_keys.zip (release.jks and
# release.txt). The produced APK is verified against the keystore's
# SHA-256 fingerprint with apksigner; a mismatch fails the build. A
# debug build does not require keys and is signed with the Android
# debug keystore.
#
# @author Richard Korbla Adzido
# @version 1.5.0
# @since 1.0.0
# ============================================================================

name: Build Llama Music Player APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      use_cache:
        description: 'Use Gradle build cache'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # ========================================================================
    # Verify source archive identity
    # ========================================================================
    - name: Verify source archive identity
      run: |
        set -e
        [ -f llama_music_player.zip ]        || { echo "ERROR: llama_music_player.zip missing"; exit 1; }
        [ -f llama_music_player.zip.sha256 ] || { echo "ERROR: llama_music_player.zip.sha256 missing"; exit 1; }

        EXPECTED=$(tr -d '[:space:]' < llama_music_player.zip.sha256)
        ACTUAL=$(sha256sum llama_music_player.zip | awk '{print $1}')
        [ "$EXPECTED" = "$ACTUAL" ] || {
          echo "SOURCE ARCHIVE MISMATCH"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          exit 1
        }
        echo "Archive identity: $EXPECTED"

    # ========================================================================
    # Extract source archive
    # ========================================================================
    - name: Extract source archive
      run: |
        set -e
        rm -rf app src build .gradle extracted
        mkdir -p extracted

        unzip -q llama_music_player.zip -d extracted
        rm llama_music_player.zip

        # unzip applies the archive's stored directory modes. A
        # directory stored without search permission becomes
        # unreadable, and find cannot enter it to repair it. Walk
        # the tree top-down: make each level traversable before the
        # next is entered, so nothing ever needs to open a directory
        # it cannot read.
        chmod 755 extracted
        for d in extracted/* extracted/.[!.]*; do
          [ -e "$d" ] || continue
          chmod 755 "$d" 2>/dev/null || true
        done
        find extracted -type d -exec chmod 755 {} + 2>/dev/null || true
        find extracted -type f -exec chmod 644 {} + 2>/dev/null || true

        ENTRIES=$(find extracted -mindepth 1 -maxdepth 1 | wc -l)
        if [ "$ENTRIES" -eq 1 ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
          SRC="$(find extracted -mindepth 1 -maxdepth 1 -type d)"
        else
          SRC="extracted"
        fi

        cp -R "$SRC"/. .
        rm -rf extracted

        # Normalize the workspace tree: directories 755, regular
        # files 644, executables 755.
        find . -path ./.git -prune -o -type d -exec chmod 755 {} +
        find . -path ./.git -prune -o -type f -exec chmod 644 {} +
        chmod 755 gradlew
        if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
          chmod 755 gradle/wrapper/gradle-wrapper.jar
        fi

        echo "Source tree: $SRC"
        echo "Permissions normalized."

    # ========================================================================
    # Verify compiler reads the approved bytes
    # ========================================================================
    - name: Verify compiler reads the approved bytes
      run: |
        set -e
        [ -f gradle-files.sha256 ] || { echo "ERROR: gradle-files.sha256 missing"; exit 1; }

        FAIL=0
        while read -r expected path; do
          [ -z "$expected" ] && continue
          if [ ! -f "$path" ]; then
            echo "MISSING: $path"
            FAIL=1
            continue
          fi
          actual=$(sha256sum "$path" | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "MISMATCH: $path"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            FAIL=1
          fi
        done < gradle-files.sha256

        [ "$FAIL" -eq 0 ] || {
          echo ""
          echo "The files Gradle would read are not the files that were approved."
          echo "Refresh the archive and the manifest from the same source tree,"
          echo "then commit both."
          exit 1
        }
        echo "Compiler input matches the approved bytes."

    # ========================================================================
    # Set up JDK 17
    # ========================================================================
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # ========================================================================
    # Set up Android SDK
    # ========================================================================
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    # ========================================================================
    # Install SDK packages
    # ========================================================================
    - name: Install SDK packages
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-35"

    # ========================================================================
    # Validate Gradle configuration
    # ========================================================================
    - name: Validate Gradle configuration
      run: |
        set -e
        ./gradlew --no-daemon help --stacktrace
        echo "Gradle parsed the approved files."

    # ========================================================================
    # Extract release keys
    # ========================================================================
    - name: Extract release keys
      run: |
        BUILD_TYPE="${{ github.event.inputs.build_type }}"
        if [ -f llama_release_keys.zip ]; then
          mkdir -p signing
          unzip -o llama_release_keys.zip -d signing/
          rm llama_release_keys.zip
          chmod -R 755 signing/
          JKS_FILE=$(find signing -name release.jks -type f | head -1)
          TXT_FILE=$(find signing -name release.txt -type f | head -1)
          [ -n "$JKS_FILE" ] || { echo "ERROR: release.jks missing"; exit 1; }
          [ -n "$TXT_FILE" ] || { echo "ERROR: release.txt missing"; exit 1; }
          JKS_DIR=$(dirname "$JKS_FILE")
          [ "$JKS_DIR" = signing ] || mv "$JKS_DIR"/* signing/
        else
          [ "$BUILD_TYPE" = release ] && { echo "ERROR: llama_release_keys.zip missing"; exit 1; }
          echo "Debug build; no keys required."
        fi

    # ========================================================================
    # Parse signing credentials
    # ========================================================================
    - name: Parse signing credentials
      id: signing_creds
      run: |
        if [ -f signing/release.txt ]; then
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('signing/release.txt','utf8').split(/\r?\n/);
            let ks='',ka='',kp='',m;
            for (const l of lines) {
              const t=l.trim();
              if ((m=t.match(/(?:KEYSTORE_PASSWORD|STORE_PASSWORD)[=:]\\s*(.*)/i))) ks=m[1].trim();
              else if ((m=t.match(/KEY_ALIAS[=:]\\s*(.*)/i))) ka=m[1].trim();
              else if ((m=t.match(/(?:KEY_PASSWORD|ALIAS_PASSWORD)[=:]\\s*(.*)/i))) kp=m[1].trim();
            }
            if (!ks||!ka||!kp) { console.error('Missing credentials'); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'KEYSTORE_PASSWORD='+ks+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'KEY_ALIAS='+ka+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'KEY_PASSWORD='+kp+'\n');
          "
        fi

    # ========================================================================
    # Configure signing in local.properties
    # ========================================================================
    - name: Configure signing in local.properties
      run: |
        rm -f local.properties
        if [ -f signing/release.jks ] && [ -n "${{ steps.signing_creds.outputs.KEYSTORE_PASSWORD }}" ]; then
          printf 'signing.storeFile=%s/signing/release.jks\n' "$GITHUB_WORKSPACE"  >  local.properties
          printf 'signing.storePassword=%s\n' "${{ steps.signing_creds.outputs.KEYSTORE_PASSWORD }}" >> local.properties
          printf 'signing.keyAlias=%s\n'       "${{ steps.signing_creds.outputs.KEY_ALIAS }}"       >> local.properties
          printf 'signing.keyPassword=%s\n'    "${{ steps.signing_creds.outputs.KEY_PASSWORD }}"    >> local.properties
        fi

    # ========================================================================
    # Restore Gradle cache
    # ========================================================================
    - name: Restore Gradle cache
      if: github.event.inputs.use_cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # ========================================================================
    # Build APK
    # ========================================================================
    - name: Build APK
      run: |
        PREFIX=""
        [ "${{ github.event.inputs.use_cache }}" = "true" ] || PREFIX="clean"
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          ./gradlew $PREFIX assembleRelease --stacktrace
        else
          ./gradlew $PREFIX assembleDebug --stacktrace
        fi

    # ========================================================================
    # Verify APK signing
    # ========================================================================
    - name: Verify APK signing
      if: github.event.inputs.build_type == 'release'
      run: |
        set -e
        APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
        [ -n "$APK" ] || { echo "ERROR: no release APK"; exit 1; }
        BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d -name '[0-9]*' | sort -V | tail -1)
        [ -x "$BT/apksigner" ] || { echo "ERROR: apksigner missing"; exit 1; }
        KEYTOOL="keytool"
        [ -x "$JAVA_HOME/bin/keytool" ] && KEYTOOL="$JAVA_HOME/bin/keytool"

        "$BT/apksigner" verify --verbose "$APK"
        JKS_FP=$($KEYTOOL -list -v -keystore signing/release.jks \
          -storepass "${{ steps.signing_creds.outputs.KEYSTORE_PASSWORD }}" \
          -alias "${{ steps.signing_creds.outputs.KEY_ALIAS }}" 2>/dev/null \
          | grep SHA256: | head -1 | sed 's/.*SHA256: //' | tr -d '[:space:]')
        APK_FP=$("$BT/apksigner" verify --print-certs "$APK" 2>/dev/null \
          | grep 'Signer #1 certificate SHA-256 digest:' | head -1 | sed 's/.*digest: //' | tr -d '[:space:]')
        [ -n "$JKS_FP" ] && [ "$JKS_FP" = "$APK_FP" ] || {
          echo "APK signer does not match the approved keystore"
          echo "keystore: $JKS_FP"
          echo "apk:      $APK_FP"
          exit 1
        }
        echo "APK signer matches keystore: $APK_FP"

    # ========================================================================
    # Upload APK
    # ========================================================================
    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: llama_music_player-${{ github.event.inputs.build_type }}-apk
        path: app/build/outputs/apk/${{ github.event.inputs.build_type }}/*.apk
        retention-days: 30

    # ========================================================================
    # Clean up signing files
    # ========================================================================
    - name: Clean up signing files
      if: always()
      run: rm -rf signing/
