# ============================================================================
# Llama Music Player - GitHub Actions Workflow
# ============================================================================
# Builds the Llama Music Player APK on GitHub's runners.
#
# Target stack:
# - SDK 36 (Android 16), compileSdk 36, targetSdk 36, minSdk 23
# - AGP 8.7.2, Gradle 8.9, Kotlin 2.0.21, JDK 17
# - Node.js 24 (latest)
# - Ubuntu latest
# - Core library desugaring
# - EventBus with the library's reflective subscriber lookup
#
# Source is delivered as llama_music_player.zip at the tip of the
# branch this workflow runs on. actions/checkout@v6 checks out that
# branch at HEAD, and this workflow extracts the archive and builds
# it. The archive layout expected:
#
#   llama_music_player/
#     app/
#       build.gradle.kts
#       src/main/kotlin/com/ark/llama/*.kt
#       src/main/assets/fonts/fa-solid-900.ttf
#     build.gradle.kts
#     settings.gradle.kts
#     gradle.properties
#     gradlew, gradlew.bat
#     gradle/wrapper/...
#
# Uses official action versions:
# - actions/checkout@v6
# - actions/setup-java@v6
# - actions/setup-node@v6
# - actions/cache@v6
# - android-actions/setup-android@v4.0.4
# - actions/upload-artifact@v6
#
# Signs the release APK using:
# - llama_release_keys.zip (contains release.jks and release.txt,
#   optionally in a subfolder)
# - release.txt format:
#     KEYSTORE_PASSWORD=xxx
#     KEY_ALIAS=xxx
#     KEY_PASSWORD=xxx
#
# Debug builds are signed with the Android debug keystore.
#
# @author Richard Korbla Adzido
# @version 1.6.0
# @since 1.0.0
# ============================================================================

name: Build Llama Music Player APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ========================================================================
    # Checkout
    # ========================================================================
    - uses: actions/checkout@v6

    # ========================================================================
    # Record source archive identity
    # ========================================================================
    - name: Record source archive identity
      run: |
        echo "=========================================="
        echo "SOURCE ARCHIVE IDENTIFICATION"
        echo "=========================================="
        echo "Branch / ref:             ${GITHUB_REF_NAME}"
        echo "Checked-out SHA:          $(git rev-parse HEAD)"
        echo "Checked-out commit date:  $(git log -1 --format=%cI)"
        echo "Checked-out commit subj:  $(git log -1 --format=%s)"
        echo ""
        echo "Zip last touched by:      $(git log -1 --format=%H -- llama_music_player.zip)"
        echo "Zip last touched on:      $(git log -1 --format=%cI -- llama_music_player.zip)"
        echo "Zip last touched subj:    $(git log -1 --format=%s -- llama_music_player.zip)"
        echo "Zip SHA256:               $(sha256sum llama_music_player.zip | awk '{print $1}')"
        echo "Zip size:                 $(stat -c%s llama_music_player.zip) bytes"
        echo "Zip mtime in runner:      $(stat -c%y llama_music_player.zip)"
        echo "=========================================="

    # ========================================================================
    # Extract main project zip
    # ========================================================================
    - name: Extract llama_music_player.zip
      run: |
        set -euo pipefail
        echo "Found llama_music_player.zip, extracting..."
        unzip -o llama_music_player.zip
        if [ ! -d llama_music_player ]; then
          echo "::error::Zip did not contain a llama_music_player/ folder."
          exit 1
        fi
        sudo chmod -R 755 llama_music_player
        echo "Copying contents to root..."
        cp -r llama_music_player/* .
        cp -r llama_music_player/.[!.]* . 2>/dev/null || true
        rm -rf llama_music_player llama_music_player.zip
        echo "Extraction complete."
        echo "Files after extraction:"
        ls -la

    # ========================================================================
    # Print exactly what the compiler will read for the two problem files
    # ========================================================================
    # This step reads the extracted source and prints the specific
    # declarations that the compile step is complaining about. It does
    # not modify anything. Its output tells you, definitively, whether
    # the source the compiler will compile contains the intended
    # declarations or the ones that produce the compile errors.
    - name: Prove what the compiler will read
      run: |
        echo "=========================================="
        echo "SOURCE PREVIEW: MusicPlayer.kt / NotificationController.kt"
        echo "=========================================="
        echo ""
        echo "===== MusicPlayer.kt — around line 285 ====="
        sed -n '283,300p' app/src/main/kotlin/com/ark/llama/MusicPlayer.kt
        echo ""
        echo "===== MusicPlayer.kt — commitRunnable / outerUpdate ====="
        grep -nE 'val (commitRunnable|outerUpdate)' \
          app/src/main/kotlin/com/ark/llama/MusicPlayer.kt || echo "(no matches)"
        echo ""
        echo "===== NotificationController.kt — around line 875 ====="
        sed -n '873,882p' app/src/main/kotlin/com/ark/llama/NotificationController.kt
        echo ""
        echo "===== NotificationController.kt — NEUTRAL_COLOR / RED_COLOR ====="
        grep -nE '(const )?val (NEUTRAL_COLOR|RED_COLOR)' \
          app/src/main/kotlin/com/ark/llama/NotificationController.kt || echo "(no matches)"
        echo ""
        echo "=========================================="

    # ========================================================================
    # Extract and setup signing keys
    # ========================================================================
    - name: Extract llama_release_keys.zip
      run: |
        echo "=========================================="
        echo "EXTRACTING RELEASE KEYS"
        echo "=========================================="

        if [ -f "llama_release_keys.zip" ]; then
          echo "Found llama_release_keys.zip, extracting..."
          mkdir -p signing
          unzip -o llama_release_keys.zip -d signing/
          rm llama_release_keys.zip
          echo "Extraction complete"

          chmod -R 755 signing/

          echo "Contents of signing directory:"
          find signing/ -type f

          JKS_FILE=$(find signing/ -name "release.jks" -type f | head -1)
          TXT_FILE=$(find signing/ -name "release.txt" -type f | head -1)

          if [ -z "$JKS_FILE" ]; then
            echo "ERROR: release.jks not found in zip!"
            exit 1
          fi
          if [ -z "$TXT_FILE" ]; then
            echo "ERROR: release.txt not found in zip!"
            exit 1
          fi

          JKS_DIR=$(dirname "$JKS_FILE")
          if [ "$JKS_DIR" != "signing" ]; then
            echo "Moving files from $JKS_DIR to signing/..."
            mv "$JKS_DIR"/* signing/
            rmdir "$JKS_DIR" 2>/dev/null || true
          fi

          echo "SUCCESS: Both release.jks and release.txt found"
          ls -la signing/
        else
          echo "WARNING: llama_release_keys.zip not found!"
          echo "Will build unsigned APK (debug only)"
        fi

    # ========================================================================
    # Set up Node.js 24 (latest)
    # ========================================================================
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    # ========================================================================
    # Parse signing credentials from release.txt using Node.js
    # ========================================================================
    - name: Parse signing credentials
      id: signing_creds
      run: |
        if [ -f "signing/release.txt" ]; then
          echo "Parsing signing credentials from release.txt..."

          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('signing/release.txt', 'utf8');
            const lines = content.split(/\r?\n/);

            let keystorePassword = '';
            let keyAlias = '';
            let keyPassword = '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('KEYSTORE_PASSWORD') || trimmed.startsWith('STORE_PASSWORD')) {
                const match = trimmed.match(/(?:KEYSTORE_PASSWORD|STORE_PASSWORD)[=:]\\s*(.*)/i);
                if (match) keystorePassword = match[1].trim();
              }
              else if (trimmed.startsWith('KEY_ALIAS')) {
                const match = trimmed.match(/KEY_ALIAS[=:]\\s*(.*)/i);
                if (match) keyAlias = match[1].trim();
              }
              else if (trimmed.startsWith('KEY_PASSWORD') || trimmed.startsWith('ALIAS_PASSWORD')) {
                const match = trimmed.match(/(?:KEY_PASSWORD|ALIAS_PASSWORD)[=:]\\s*(.*)/i);
                if (match) keyPassword = match[1].trim();
              }
            }

            if (!keystorePassword || !keyAlias || !keyPassword) {
              console.error('ERROR: Missing required signing credentials');
              console.error('KEYSTORE_PASSWORD: ' + (keystorePassword ? 'present' : 'missing'));
              console.error('KEY_ALIAS: ' + (keyAlias ? 'present' : 'missing'));
              console.error('KEY_PASSWORD: ' + (keyPassword ? 'present' : 'missing'));
              process.exit(1);
            }

            console.log('KEYSTORE_PASSWORD=' + keystorePassword);
            console.log('KEY_ALIAS=' + keyAlias);
            console.log('KEY_PASSWORD=' + keyPassword);

            const fs_write = require('fs');
            fs_write.appendFileSync(process.env.GITHUB_OUTPUT, 'KEYSTORE_PASSWORD=' + keystorePassword + '\n');
            fs_write.appendFileSync(process.env.GITHUB_OUTPUT, 'KEY_ALIAS=' + keyAlias + '\n');
            fs_write.appendFileSync(process.env.GITHUB_OUTPUT, 'KEY_PASSWORD=' + keyPassword + '\n');
          "

          echo "SUCCESS: Signing credentials parsed"
          echo "KEY_ALIAS: ${{ steps.signing_creds.outputs.KEY_ALIAS }}"
        else
          echo "No signing credentials found"
        fi

    # ========================================================================
    # Configure signing in local.properties
    # ========================================================================
    - name: Configure signing in local.properties
      run: |
        if [ -f "signing/release.jks" ] && [ -n "${{ steps.signing_creds.outputs.KEYSTORE_PASSWORD }}" ]; then
          echo "Configuring signing in local.properties..."

          echo "signing.storeFile=${{ github.workspace }}/signing/release.jks" >> local.properties
          echo "signing.storePassword=${{ steps.signing_creds.outputs.KEYSTORE_PASSWORD }}" >> local.properties
          echo "signing.keyAlias=${{ steps.signing_creds.outputs.KEY_ALIAS }}" >> local.properties
          echo "signing.keyPassword=${{ steps.signing_creds.outputs.KEY_PASSWORD }}" >> local.properties

          echo "SUCCESS: Signing configuration added to local.properties"
        else
          echo "Skipping signing configuration - keys not available"
        fi

    # ========================================================================
    # Ensure required directories exist
    # ========================================================================
    - name: Ensure required directories exist
      run: |
        mkdir -p app/libs
        mkdir -p app/src/main/assets/fonts
        mkdir -p app/src/main/jniLibs

    # ========================================================================
    # Prepare assets
    # ========================================================================
    - name: Prepare assets
      run: |
        echo "=========================================="
        echo "PREPARING ASSETS"
        echo "=========================================="

        if [ -f "app/src/main/assets/fonts/fa-solid-900.ttf" ]; then
          echo "PASS: FontAwesome found"
        else
          echo "FAIL: FontAwesome font missing"
          exit 1
        fi

        echo ""
        echo "FontAwesome:"
        ls -la app/src/main/assets/fonts/ 2>/dev/null || echo "MISSING"

    # ========================================================================
    # Create gradle wrapper (only if missing from the checkout)
    # ========================================================================
    - name: Create gradle wrapper if missing
      run: |
        if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          echo "Gradle wrapper already present in the checkout; leaving it untouched."
          cat gradle/wrapper/gradle-wrapper.properties
          exit 0
        fi

        echo "Gradle wrapper missing; generating a minimal one (Gradle 8.9)."
        rm -f gradlew gradlew.bat

        cat > gradlew << 'EOF'
        #!/bin/sh
        ##############################################################################
        ##
        ##  Gradle start up script for UN*X
        ##
        ##############################################################################
        APP_BASE_NAME=`basename "$0"`
        APP_HOME=`dirname "$0"`
        DEFAULT_JVM_OPTS=""
        CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
        if [ -n "$JAVA_HOME" ] ; then
            JAVACMD="$JAVA_HOME/bin/java"
        else
            JAVACMD="java"
        fi
        exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF

        chmod +x gradlew

        mkdir -p gradle/wrapper

        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar

        echo "Gradle wrapper created successfully (Gradle 8.9)"

    # ========================================================================
    # Create settings.gradle.kts if missing
    # ========================================================================
    - name: Create settings.gradle.kts if missing
      run: |
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          cat > settings.gradle.kts << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include(":app")
        rootProject.name = "LlamaMusicPlayer"
        EOF
        fi

    # ========================================================================
    # Create gradle.properties if missing
    # ========================================================================
    - name: Create gradle.properties if missing
      run: |
        if [ ! -f "gradle.properties" ]; then
          cat > gradle.properties << 'EOF'
        android.useAndroidX=true
        android.enableJetifier=false
        android.nonTransitiveRClass=true
        android.suppressUnsupportedCompileSdk=36
        org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g
        org.gradle.parallel=true
        org.gradle.caching=true
        org.gradle.daemon=true
        EOF
        fi

    # ========================================================================
    # Set up JDK 17
    # ========================================================================
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    # ========================================================================
    # Cache Gradle dependencies
    # ========================================================================
    - name: Cache Gradle
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # ========================================================================
    # Set up Android SDK
    # ========================================================================
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4.0.4

    # ========================================================================
    # Install SDK packages required by the build
    # ========================================================================
    - name: Install SDK packages
      run: |
        echo "=========================================="
        echo "INSTALLING SDK PACKAGES"
        echo "=========================================="

        yes | sdkmanager --licenses > /dev/null 2>&1 || true

        sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

        echo ""
        echo "Installed components:"
        sdkmanager --list_installed 2>/dev/null || sdkmanager --list 2>/dev/null | head -40

    # ========================================================================
    # Grant execute permission for gradlew
    # ========================================================================
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ========================================================================
    # Verify Kotlin-only source layout
    # ========================================================================
    - name: Verify Kotlin-only source layout
      run: |
        set -euo pipefail

        echo "Checking for stray Java sources..."
        STRAY_JAVA=$(find . -type f -name '*.java' \
            -not -path './app/build/*' \
            -not -path './build/*' \
            -not -path './.gradle/*' 2>/dev/null || true)
        if [ -n "$STRAY_JAVA" ]; then
          echo "ERROR: .java files found outside build output:" >&2
          echo "$STRAY_JAVA" >&2
          exit 1
        fi
        echo "OK: no .java files outside build output"

        echo "Checking that every Kotlin source lives under src/main/kotlin/..."
        KT_COUNT=$(find app/src/main/kotlin -type f -name '*.kt' 2>/dev/null | wc -l | tr -d ' ')
        if [ "$KT_COUNT" -eq 0 ]; then
          echo "ERROR: no Kotlin sources found under app/src/main/kotlin/" >&2
          exit 1
        fi
        echo "OK: $KT_COUNT Kotlin sources under app/src/main/kotlin/"

        echo "Checking that src/main/java/ is gone (or empty)..."
        if [ -d app/src/main/java ]; then
          if [ -n "$(ls -A app/src/main/java 2>/dev/null)" ]; then
            echo "ERROR: app/src/main/java/ is not empty:" >&2
            ls -A app/src/main/java >&2
            exit 1
          else
            echo "OK: app/src/main/java/ exists but is empty"
          fi
        else
          echo "OK: app/src/main/java/ is gone"
        fi

    # ========================================================================
    # Build APK
    # ========================================================================
    - name: Build APK
      run: |
        ./gradlew clean
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "Building RELEASE APK..."
          ./gradlew assembleRelease --stacktrace
        else
          echo "Building DEBUG APK..."
          ./gradlew assembleDebug --stacktrace
        fi

    # ========================================================================
    # Verify APK signing (release only)
    # ========================================================================
    - name: Verify APK signing
      if: github.event.inputs.build_type == 'release'
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -f "$APK_PATH" ]; then
          echo "Verifying APK signing for: $APK_PATH"
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d -name "[0-9]*" | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            $BUILD_TOOLS_DIR/apksigner verify --verbose "$APK_PATH" || {
              echo "WARNING: APK signing verification failed"
            }
          else
            echo "apksigner not found, skipping verification"
          fi
        else
          echo "No release APK found to verify"
        fi

    # ========================================================================
    # Upload APK artifact
    # ========================================================================
    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: llama_music_player-${{ github.event.inputs.build_type }}-apk
        path: app/build/outputs/apk/${{ github.event.inputs.build_type }}/*.apk
        retention-days: 30

    # ========================================================================
    # Clean up sensitive signing files
    # ========================================================================
    - name: Clean up signing files
      if: always()
      run: |
        rm -rf signing/
        echo "Cleaned up signing files"
