name: Build Llama Music Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract Llama.zip
      run: |
        if [ -f "Llama.zip" ]; then
          echo "Found Llama.zip, extracting..."
          unzip -o Llama.zip
          rm Llama.zip
        fi
        
        # If extraction created a folder, move contents up
        if [ -d "Llama" ]; then
          mv Llama/* .
          mv Llama/.* . 2>/dev/null || true
          rm -rf Llama
        fi
        
        echo "Files after extraction:"
        ls -la
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install CMake and NDK
      run: |
        # Accept licenses
        yes | sdkmanager --licenses || true
        
        # Install CMake 3.18.1
        yes | sdkmanager "cmake;3.18.1"
        
        # Install NDK
        yes | sdkmanager "ndk;25.1.8937393"
        
        # Verify installations
        echo "CMake versions:"
        ls -la $ANDROID_HOME/cmake/
        
        echo "NDK versions:"
        ls -la $ANDROID_HOME/ndk/
    
    - name: Set CMake PATH
      run: |
        echo "$ANDROID_HOME/cmake/3.18.1/bin" >> $GITHUB_PATH
        cmake --version
    
    - name: Setup Gradle
      run: |
        # Create gradle wrapper directory
        mkdir -p gradle/wrapper
        
        # Create gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Download gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
        
        # Create gradlew script
        cat > gradlew << 'EOF'
        #!/bin/sh
        exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        
        # Create gradlew.bat for Windows
        cat > gradlew.bat << 'EOF'
        @if "%DEBUG%" == "" @echo off
        @rem ########## Gradle wrapper startup script ##########
        set DIRNAME=%~dp0
        set APP_BASE_NAME=%~n0
        set GRADLE_USER_HOME=%DIRNAME%\.gradle
        java -cp "%DIRNAME%\gradle\wrapper\gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain %*
        EOF
        
        chmod +x gradlew
        
        echo "Gradle wrapper created successfully"
        ls -la gradle/wrapper/
    
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: llama-music-player-apk
        path: app/build/outputs/apk/release/*.apk
