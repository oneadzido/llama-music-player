name: Build Llama Music Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract Llama.zip
      run: |
        if [ -f "Llama.zip" ]; then
          echo "Found Llama.zip, extracting..."
          unzip -o Llama.zip
          rm Llama.zip
        fi
        
        if [ -d "Llama" ]; then
          mv Llama/* .
          rm -rf Llama
        fi
        
        echo "Files after extraction:"
        ls -la
    
    - name: Create libs directory
      run: |
        mkdir -p app/libs
    
    - name: Download and Extract SoundTouch
      run: |
        echo "Downloading SoundTouch source..."
        curl -L -o soundtouch.tar.gz https://www.surina.net/soundtouch/soundtouch-2.3.3.tar.gz
        
        echo "Extracting..."
        tar -xzf soundtouch.tar.gz
        
        echo "Listing extracted directory structure:"
        ls -la
        echo ""
        echo "Looking for SoundTouch source in extracted folder:"
        ls -la soundtouch-2.3.3/
        echo ""
        echo "Looking for SoundTouch source subdirectories:"
        ls -la soundtouch-2.3.3/source/ || echo "No source directory"
        
        # Create destination directory
        mkdir -p app/src/main/cpp/soundtouch
        
        # Correct path for SoundTouch 2.3.3 - the source is directly in the main folder
        if [ -f "soundtouch-2.3.3/SoundTouch.h" ]; then
          echo "Found SoundTouch.h in root directory"
          cp soundtouch-2.3.3/*.cpp app/src/main/cpp/soundtouch/ 2>/dev/null || true
          cp soundtouch-2.3.3/*.h app/src/main/cpp/soundtouch/ 2>/dev/null || true
        elif [ -d "soundtouch-2.3.3/SoundTouch" ]; then
          echo "Found SoundTouch directory"
          cp soundtouch-2.3.3/SoundTouch/*.cpp app/src/main/cpp/soundtouch/ 2>/dev/null || true
          cp soundtouch-2.3.3/SoundTouch/*.h app/src/main/cpp/soundtouch/ 2>/dev/null || true
        elif [ -d "soundtouch-2.3.3/include/SoundTouch" ]; then
          echo "Found SoundTouch in include directory"
          cp soundtouch-2.3.3/include/SoundTouch/*.cpp app/src/main/cpp/soundtouch/ 2>/dev/null || true
          cp soundtouch-2.3.3/include/SoundTouch/*.h app/src/main/cpp/soundtouch/ 2>/dev/null || true
        else
          echo "ERROR: Could not find SoundTouch source"
          echo "Searching entire extracted folder for .cpp files:"
          find soundtouch-2.3.3 -name "*.cpp" | head -20
          exit 1
        fi
        
        # Clean up
        rm -rf soundtouch.tar.gz soundtouch-2.3.3
        
        echo "SoundTouch files copied:"
        ls -la app/src/main/cpp/soundtouch/
    
    - name: Download jaudiotagger 3.0.1
      run: |
        curl -L -o app/libs/jaudiotagger.jar https://repo1.maven.org/maven2/net/jthink/jaudiotagger/3.0.1/jaudiotagger-3.0.1.jar
        ls -la app/libs/
    
    - name: Create top-level build.gradle
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
                flatDir {
                    dirs 'app/libs'
                }
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF
    
    - name: Create settings.gradle
      run: echo "include ':app'" > settings.gradle
    
    - name: Create gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
        cat > gradlew << 'EOF'
        #!/bin/sh
        exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        chmod +x gradlew
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK
      run: |
        yes | sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
    
    - name: Build APK
      run: |
        ./gradlew assembleRelease --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: llama-music-player-apk
        path: app/build/outputs/apk/release/*.apk
