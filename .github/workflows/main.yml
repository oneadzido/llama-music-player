name: Debug SoundTouch Download

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Download and list SoundTouch contents
      run: |
        echo "Downloading SoundTouch source..."
        curl -L -o soundtouch.tar.gz https://www.surina.net/soundtouch/soundtouch-2.3.3.tar.gz

        echo "Checking download integrity..."
        file soundtouch.tar.gz
        tar -tzf soundtouch.tar.gz | head -20
        tar -xzf soundtouch.tar.gz

        echo "Listing current directory after extraction:"
        ls -la

        echo "Searching for 'soundtouch' folders:"
        find . -name "*soundtouch*" -type d

        echo "Searching for 'SoundTouch.h':"
        find . -name "SoundTouch.h"

        echo "Searching for all .cpp files:"
        find . -name "*.cpp" | head -20
