name: Build Llama Music Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract Llama.zip
      run: |
        if [ -f "Llama.zip" ]; then
          unzip -o Llama.zip
          rm Llama.zip
        fi
        if [ -d "Llama" ]; then
          mv Llama/* .
          rm -rf Llama
        fi
    
    - name: Create libs directory
      run: mkdir -p app/libs
    
    - name: Download SoundTouch
      run: |
        curl -L -o soundtouch.tar.gz https://www.surina.net/soundtouch/soundtouch-2.3.3.tar.gz
        tar -xzf soundtouch.tar.gz
        mkdir -p app/src/main/cpp/soundtouch
        # Copy ALL .cpp and .h files from anywhere inside the extracted folder
        find soundtouch-2.3.3 -name "*.cpp" -exec cp {} app/src/main/cpp/soundtouch/ \;
        find soundtouch-2.3.3 -name "*.h" -exec cp {} app/src/main/cpp/soundtouch/ \;
        rm -rf soundtouch-2.3.3 soundtouch.tar.gz
        ls -la app/src/main/cpp/soundtouch/
    
    - name: Download jaudiotagger
      run: |
        curl -L -o app/libs/jaudiotagger.jar https://repo1.maven.org/maven2/net/jthink/jaudiotagger/3.0.1/jaudiotagger-3.0.1.jar
    
    - name: Create build.gradle
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.0' }
        }
        allprojects {
            repositories { google(); mavenCentral(); flatDir { dirs 'app/libs' } }
        }
        task clean(type: Delete) { delete rootProject.buildDir }
        EOF
    
    - name: Create settings.gradle
      run: echo "include ':app'" > settings.gradle
    
    - name: Create gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
        cat > gradlew << 'EOF'
        #!/bin/sh
        exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        chmod +x gradlew
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK
      run: |
        yes | sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
    
    - name: Build APK
      run: ./gradlew assembleRelease --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: llama-music-player-apk
        path: app/build/outputs/apk/release/*.apk
