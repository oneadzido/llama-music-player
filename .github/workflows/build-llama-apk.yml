# ============================================================================
# Llama Music Player - GitHub Actions Workflow
# ============================================================================
# 
# This GitHub Actions workflow builds the Llama Music Player APK automatically
# on GitHub's runners. It supports both release and debug builds with
# automatic signing when keys are provided.
# 
# <p>Features:</p>
# <ul>
#   <li>Node.js 24 native actions for optimal performance</li>
#   <li>Automatic APK signing using llama-release-keys.zip</li>
#   <li>Debug builds automatically signed with debug keystore</li>
#   <li>Artifact upload for easy download of built APKs</li>
#   <li>SDK 35 (Android 15) with JDK 17</li>
# </ul>
# 
# <p>Trigger:</p>
# <ul>
#   <li>Manual trigger via workflow_dispatch with build type selection</li>
# </ul>
# 
# <p>Inputs:</p>
# <ul>
#   <li>build_type: "release" or "debug" - determines which build to create</li>
# </ul>
# 
# <p>Signing Key Format (llama-release-keys.zip):</p>
# <pre>
# release.jks - The keystore file
# release.txt - Contains credentials in format:
#   KEYSTORE_PASSWORD=xxx
#   KEY_ALIAS=xxx
#   KEY_PASSWORD=xxx
# </pre>
# 
# <p>SoundTouch Native Library:</p>
# <p>The official SoundTouch native library is included as pre-built .so files
# in the jniLibs directory. No NDK installation is required.</p>
# 
# File Location: .github/workflows/build-llama-apk.yml
# 
# @author Richard Korbla Adzido
# @version 1.0.1
# @since 1.0
# ============================================================================

name: Build Llama Music Player APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ====================================================================
      # Source Code Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ====================================================================
      # Project Archive Extraction
      # ====================================================================
      - name: Extract project archive
        run: |
          if [ -f "llama-music-player.zip" ]; then
            echo "Found llama-music-player.zip, extracting..."
            unzip -o llama-music-player.zip
            rm llama-music-player.zip
            echo "Extraction complete"
          fi
          if [ -d "llama-music-player" ]; then
            sudo chmod -R 755 llama-music-player
            echo "Copying contents to root..."
            cp -r llama-music-player/* . 2>/dev/null || true
            cp -r llama-music-player/.[!.]* . 2>/dev/null || true
          fi
          echo "Files after extraction:"
          ls -la

      # ====================================================================
      # Signing Key Extraction
      # ====================================================================
      - name: Extract signing keys
        run: |
          echo "=========================================="
          echo "EXTRACTING RELEASE KEYS"
          echo "=========================================="
          
          if [ -f "llama-release-keys.zip" ]; then
            echo "Found llama-release-keys.zip, extracting..."
            mkdir -p signing
            unzip -o llama-release-keys.zip -d signing/
            rm llama-release-keys.zip
            echo "Extraction complete"
            
            chmod -R 755 signing/
            
            echo "Contents of signing directory:"
            find signing/ -type f
            
            JKS_FILE=$(find signing/ -name "release.jks" -type f | head -1)
            TXT_FILE=$(find signing/ -name "release.txt" -type f | head -1)
            
            if [ -z "$JKS_FILE" ]; then
              echo "ERROR: release.jks not found in zip!"
              exit 1
            fi
            
            if [ -z "$TXT_FILE" ]; then
              echo "ERROR: release.txt not found in zip!"
              exit 1
            fi
            
            JKS_DIR=$(dirname "$JKS_FILE")
            
            if [ "$JKS_DIR" != "signing" ]; then
              echo "Moving files from $JKS_DIR to signing/..."
              mv "$JKS_DIR"/* signing/
              rmdir "$JKS_DIR" 2>/dev/null || true
            fi
            
            echo "SUCCESS: Both release.jks and release.txt found"
            ls -la signing/
          else
            echo "WARNING: llama-release-keys.zip not found!"
            echo "Will build unsigned APK (debug only)"
          fi

      # ====================================================================
      # Signing Credentials Parsing
      # ====================================================================
      - name: Parse signing credentials
        id: signing_creds
        run: |
          if [ -f "signing/release.txt" ]; then
            echo "Parsing signing credentials from release.txt..."
            
            node -e "
              const fs = require('fs');
              const content = fs.readFileSync('signing/release.txt', 'utf8');
              const lines = content.split(/\r?\n/);
              
              let keystorePassword = '';
              let keyAlias = '';
              let keyPassword = '';
              
              for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith('KEYSTORE_PASSWORD') || trimmed.startsWith('STORE_PASSWORD')) {
                  const match = trimmed.match(/(?:KEYSTORE_PASSWORD|STORE_PASSWORD)[=:]\\s*(.*)/i);
                  if (match) keystorePassword = match[1].trim();
                }
                else if (trimmed.startsWith('KEY_ALIAS')) {
                  const match = trimmed.match(/KEY_ALIAS[=:]\\s*(.*)/i);
                  if (match) keyAlias = match[1].trim();
                }
                else if (trimmed.startsWith('KEY_PASSWORD') || trimmed.startsWith('ALIAS_PASSWORD')) {
                  const match = trimmed.match(/(?:KEY_PASSWORD|ALIAS_PASSWORD)[=:]\\s*(.*)/i);
                  if (match) keyPassword = match[1].trim();
                }
              }
              
              if (!keystorePassword || !keyAlias || !keyPassword) {
                console.error('ERROR: Missing required signing credentials');
                console.error('KEYSTORE_PASSWORD: ' + (keystorePassword ? 'present' : 'missing'));
                console.error('KEY_ALIAS: ' + (keyAlias ? 'present' : 'missing'));
                console.error('KEY_PASSWORD: ' + (keyPassword ? 'present' : 'missing'));
                process.exit(1);
              }
              
              console.log('KEYSTORE_PASSWORD=' + keystorePassword);
              console.log('KEY_ALIAS=' + keyAlias);
              console.log('KEY_PASSWORD=' + keyPassword);
              
              const fs_write = require('fs');
              fs_write.appendFileSync(process.env.GITHUB_OUTPUT, 'KEYSTORE_PASSWORD=' + keystorePassword + '\n');
              fs_write.appendFileSync(process.env.GITHUB_OUTPUT, 'KEY_ALIAS=' + keyAlias + '\n');
              fs_write.appendFileSync(process.env.GITHUB_OUTPUT, 'KEY_PASSWORD=' + keyPassword + '\n');
            "
            
            echo "SUCCESS: Signing credentials parsed"
            echo "KEY_ALIAS: ${{ steps.signing_creds.outputs.KEY_ALIAS }}"
          else
            echo "No signing credentials found"
          fi

      # ====================================================================
      # Signing Configuration
      # ====================================================================
      - name: Configure signing in local.properties
        run: |
          if [ -f "signing/release.jks" ] && [ -n "${{ steps.signing_creds.outputs.KEYSTORE_PASSWORD }}" ]; then
            echo "Configuring signing in local.properties..."
            
            echo "signing.storeFile=${{ github.workspace }}/signing/release.jks" >> local.properties
            echo "signing.storePassword=${{ steps.signing_creds.outputs.KEYSTORE_PASSWORD }}" >> local.properties
            echo "signing.keyAlias=${{ steps.signing_creds.outputs.KEY_ALIAS }}" >> local.properties
            echo "signing.keyPassword=${{ steps.signing_creds.outputs.KEY_PASSWORD }}" >> local.properties
            
            echo "SUCCESS: Signing configuration added to local.properties"
          else
            echo "Skipping signing configuration - keys not available"
          fi

      # ====================================================================
      # Directory Preparation
      # ====================================================================
      - name: Prepare directories
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/assets/fonts

      # ====================================================================
      # Asset Preparation
      # ====================================================================
      - name: Prepare assets and libraries
        run: |
          echo "=========================================="
          echo "PREPARING ASSETS AND NATIVE LIBRARIES"
          echo "=========================================="
          
          # FontAwesome - required for UI icons
          if [ -f "app/src/main/assets/fonts/fa-solid-900.ttf" ]; then
            echo "PASS: FontAwesome found"
          elif [ -f "llama-music-player/app/src/main/assets/fonts/fa-solid-900.ttf" ]; then
            echo "PASS: FontAwesome found in llama-music-player folder"
            mkdir -p app/src/main/assets/fonts
            cp llama-music-player/app/src/main/assets/fonts/fa-solid-900.ttf app/src/main/assets/fonts/
          else
            echo "FAIL: FontAwesome font missing"
            exit 1
          fi
          
          # jaudiotagger - required for metadata editing
          if [ -f "app/libs/jaudiotagger-3.0.1.jar" ]; then
            echo "PASS: jaudiotagger found"
          elif [ -f "app/libs/jaudiotagger.jar" ]; then
            echo "PASS: jaudiotagger found"
          elif [ -f "llama-music-player/app/libs/jaudiotagger-3.0.1.jar" ]; then
            echo "PASS: jaudiotagger found in llama-music-player folder"
            mkdir -p app/libs
            cp llama-music-player/app/libs/jaudiotagger-3.0.1.jar app/libs/
          elif [ -f "llama-music-player/app/libs/jaudiotagger.jar" ]; then
            echo "PASS: jaudiotagger found in llama-music-player folder"
            mkdir -p app/libs
            cp llama-music-player/app/libs/jaudiotagger.jar app/libs/
          else
            echo "Downloading jaudiotagger..."
            curl -L -o app/libs/jaudiotagger.jar https://repo1.maven.org/maven2/net/jthink/jaudiotagger/3.0.1/jaudiotagger-3.0.1.jar
          fi
          
          # Verify SoundTouch native libraries
          echo ""
          echo "Verifying SoundTouch native libraries..."
          if [ -d "app/src/main/jniLibs" ]; then
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              if [ -f "app/src/main/jniLibs/$abi/libsoundtouch.so" ]; then
                echo "PASS: $abi/libsoundtouch.so found"
              else
                echo "WARNING: $abi/libsoundtouch.so missing"
              fi
            done
          else
            echo "WARNING: jniLibs directory not found"
          fi
          
          echo ""
          echo "FontAwesome:"
          ls -la app/src/main/assets/fonts/ 2>/dev/null || echo "MISSING"
          echo ""
          echo "jaudiotagger:"
          ls -la app/libs/ 2>/dev/null || echo "MISSING"

      # ====================================================================
      # Gradle Wrapper Setup
      # ====================================================================
      - name: Create Gradle wrapper
        run: |
          rm -f gradlew gradlew.bat
          
          cat > gradlew << 'EOF'
          #!/bin/sh
          ##############################################################################
          ##
          ##  Gradle start up script for UN*X
          ##
          ##############################################################################
          APP_BASE_NAME=`basename "$0"`
          APP_HOME=`dirname "$0"`
          DEFAULT_JVM_OPTS=""
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          if [ -n "$JAVA_HOME" ] ; then
              JAVACMD="$JAVA_HOME/bin/java"
          else
              JAVACMD="java"
          fi
          exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          
          chmod +x gradlew
          
          mkdir -p gradle/wrapper
          
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          
          echo "Gradle wrapper created successfully (Gradle 8.0)"

      # ====================================================================
      # Default Configuration Files
      # ====================================================================
      - name: Create default build.gradle if missing
        run: |
          if [ ! -f "build.gradle" ]; then
            cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  flatDir { dirs 'app/libs' }
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          fi

      - name: Create default settings.gradle if missing
        run: |
          if [ ! -f "settings.gradle" ]; then
            cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          rootProject.name = "LlamaMusicPlayer"
          EOF
          fi

      - name: Create default gradle.properties if missing
        run: |
          if [ ! -f "gradle.properties" ]; then
            cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          EOF
          fi

      # ====================================================================
      # Build Environment Setup
      # ====================================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # ====================================================================
      # APK Build
      # ====================================================================
      - name: Build APK
        run: |
          ./gradlew clean
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "Building RELEASE APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Building DEBUG APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      # ====================================================================
      # Signing Verification
      # ====================================================================
      - name: Verify APK signing
        if: github.event.inputs.build_type == 'release'
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "Verifying APK signing for: $APK_PATH"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH" || {
              echo "WARNING: APK signing verification failed or apksigner not available"
            }
          else
            echo "No release APK found to verify"
          fi

      # ====================================================================
      # Artifact Upload
      # ====================================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-music-player-${{ github.event.inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ github.event.inputs.build_type }}/*.apk
          retention-days: 30

      # ====================================================================
      # Cleanup
      # ====================================================================
      - name: Clean up signing files
        if: always()
        run: |
          rm -rf signing/
          echo "Cleaned up signing files"
