# ============================================================================
# Llama Music Player - GitHub Actions Workflow
# ============================================================================
# This workflow builds the Llama Music Player APK on GitHub's runners.
#
# @author Richard Korbla Adzido
# @version 1.0.0
# @since 1.0
# ============================================================================

name: Build Llama Music Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract llama-music-player.zip
      run: |
        if [ -f "llama-music-player.zip" ]; then
          echo "Found llama-music-player.zip, extracting..."
          unzip -o llama-music-player.zip
          rm llama-music-player.zip
          echo "Extraction complete"
        fi
        # Fix permissions on extracted folder
        if [ -d "llama-music-player" ]; then
          sudo chmod -R 755 llama-music-player
          echo "Copying contents to root..."
          cp -r llama-music-player/* .
          cp -r llama-music-player/.[!.]* . 2>/dev/null || true
        fi
        echo "Files after extraction:"
        ls -la

    - name: Ensure required directories exist
      run: |
        mkdir -p app/libs
        mkdir -p app/src/main/assets/fonts
        mkdir -p app/src/main/cpp/soundtouch

    - name: Prepare assets
      run: |
        echo "=========================================="
        echo "PREPARING ASSETS"
        echo "=========================================="
        
        # FontAwesome - check both locations
        if [ -f "app/src/main/assets/fonts/fa-solid-900.ttf" ]; then
          echo "PASS: FontAwesome found"
        elif [ -f "llama-music-player/app/src/main/assets/fonts/fa-solid-900.ttf" ]; then
          echo "PASS: FontAwesome found in llama-music-player folder"
          mkdir -p app/src/main/assets/fonts
          cp llama-music-player/app/src/main/assets/fonts/fa-solid-900.ttf app/src/main/assets/fonts/
        else
          echo "FAIL: FontAwesome font missing"
          exit 1
        fi
        
        # jaudiotagger
        if [ -f "app/libs/jaudiotagger-3.0.1.jar" ]; then
          echo "PASS: jaudiotagger found"
        elif [ -f "app/libs/jaudiotagger.jar" ]; then
          echo "PASS: jaudiotagger found"
        elif [ -f "llama-music-player/app/libs/jaudiotagger-3.0.1.jar" ]; then
          echo "PASS: jaudiotagger found in llama-music-player folder"
          mkdir -p app/libs
          cp llama-music-player/app/libs/jaudiotagger-3.0.1.jar app/libs/
        elif [ -f "llama-music-player/app/libs/jaudiotagger.jar" ]; then
          echo "PASS: jaudiotagger found in llama-music-player folder"
          mkdir -p app/libs
          cp llama-music-player/app/libs/jaudiotagger.jar app/libs/
        else
          echo "Downloading jaudiotagger..."
          curl -L -o app/libs/jaudiotagger.jar https://repo1.maven.org/maven2/net/jthink/jaudiotagger/3.0.1/jaudiotagger-3.0.1.jar
        fi
        
        # SoundTouch
        if [ -f "app/src/main/cpp/soundtouch/SoundTouch.h" ]; then
          echo "PASS: SoundTouch found"
        elif [ -f "llama-music-player/app/src/main/cpp/soundtouch/SoundTouch.h" ]; then
          echo "PASS: SoundTouch found in llama-music-player folder"
          mkdir -p app/src/main/cpp
          cp -r llama-music-player/app/src/main/cpp/soundtouch app/src/main/cpp/
        else
          echo "Downloading SoundTouch..."
          curl -L -o soundtouch.tar.gz https://www.surina.net/soundtouch/soundtouch-2.3.3.tar.gz
          tar -xzf soundtouch.tar.gz
          mkdir -p app/src/main/cpp/soundtouch
          cp -r soundtouch/source/SoundTouch/* app/src/main/cpp/soundtouch/ 2>/dev/null || true
          cp -r soundtouch/include/* app/src/main/cpp/soundtouch/ 2>/dev/null || true
          rm -rf soundtouch.tar.gz soundtouch
        fi
        
        echo ""
        echo "FontAwesome:"
        ls -la app/src/main/assets/fonts/ 2>/dev/null || echo "MISSING"
        echo ""
        echo "jaudiotagger:"
        ls -la app/libs/ 2>/dev/null || echo "MISSING"
        echo ""
        echo "SoundTouch:"
        ls -la app/src/main/cpp/soundtouch/ 2>/dev/null | head -5 || echo "MISSING"

    - name: Create build.gradle if missing
      run: |
        if [ ! -f "build.gradle" ]; then
          cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
                flatDir { dirs 'app/libs' }
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF
        fi

    - name: Create settings.gradle if missing
      run: |
        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi

    - name: Create gradle.properties if missing
      run: |
        if [ ! -f "gradle.properties" ]; then
          cat > gradle.properties << 'EOF'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        org.gradle.parallel=true
        EOF
        fi

    - name: Create gradle wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          cat > gradlew << 'EOF'
        #!/bin/sh
        exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
          chmod +x gradlew
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        yes | sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: llama-music-player-apk
        path: app/build/outputs/apk/release/*.apk
