# ============================================================================
# Build SoundTouch Android Native Library - COMPLETE WITH ALL METHODS
# ============================================================================

name: Build SoundTouch Native Library

on:
  workflow_dispatch:
    inputs:
      soundtouch_version:
        description: 'SoundTouch version'
        required: true
        default: '2.3.3'
        type: string

jobs:
  build-soundtouch:
    name: Build SoundTouch ${{ inputs.soundtouch_version }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      
      - name: Install NDK
        run: |
          yes | sdkmanager "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      
      - name: Download SoundTouch Source
        run: |
          VERSION="${{ inputs.soundtouch_version }}"
          curl -L -o "soundtouch-$VERSION.tar.gz" "https://www.surina.net/soundtouch/soundtouch-$VERSION.tar.gz"
          tar -xzf "soundtouch-$VERSION.tar.gz"
          echo "SOUNDTOUCH_ROOT=soundtouch" >> $GITHUB_ENV
      
      - name: Locate Source Files
        run: |
          echo "SOUNDTOUCH_CPP_DIR=$SOUNDTOUCH_ROOT/source/SoundTouch" >> $GITHUB_ENV
          echo "SOUNDTOUCH_INCLUDE_DIR=$SOUNDTOUCH_ROOT/include" >> $GITHUB_ENV
      
      - name: Setup Android Build Directories
        run: |
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src"
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/libs"
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/obj"
          
          find "$SOUNDTOUCH_CPP_DIR" -name "*.cpp" -type f -exec cp {} "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/" \;
          find "$SOUNDTOUCH_INCLUDE_DIR" -name "*.h" -type f -exec cp {} "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/" \;
          find "$SOUNDTOUCH_CPP_DIR" -name "*.h" -type f -exec cp {} "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/" \; 2>/dev/null
          
          printf '%s\n' '#include "cpu_detect.h"' '' 'namespace soundtouch {' '    unsigned int detectCPUextensions() {' '        return 0;' '    }' '}' > "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
          
          printf '%s\n' '#ifndef SOUNDTOUCH_CPU_DETECT_H' '#define SOUNDTOUCH_CPU_DETECT_H' '' 'namespace soundtouch {' '    unsigned int detectCPUextensions();' '}' '' '#endif' > "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect.h"
      
      - name: Generate Android.mk
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          
          printf '%s\n' \
          'LOCAL_PATH := $(call my-dir)' \
          '' \
          'include $(CLEAR_VARS)' \
          'LOCAL_MODULE := soundtouch_core' \
          'LOCAL_SRC_FILES := \' \
          '    src/AAFilter.cpp \' \
          '    src/BPMDetect.cpp \' \
          '    src/FIFOSampleBuffer.cpp \' \
          '    src/FIRFilter.cpp \' \
          '    src/InterpolateCubic.cpp \' \
          '    src/InterpolateLinear.cpp \' \
          '    src/InterpolateShannon.cpp \' \
          '    src/PeakFinder.cpp \' \
          '    src/RateTransposer.cpp \' \
          '    src/SoundTouch.cpp \' \
          '    src/TDStretch.cpp' \
          'LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1' \
          'LOCAL_CPPFLAGS := -std=c++11' \
          'LOCAL_C_INCLUDES := $(LOCAL_PATH)/src' \
          'include $(BUILD_STATIC_LIBRARY)' \
          '' \
          'ifneq ($(filter x86 x86_64, $(TARGET_ARCH_ABI)),)' \
          'include $(CLEAR_VARS)' \
          'LOCAL_MODULE := soundtouch_optimizations' \
          'LOCAL_SRC_FILES := \' \
          '    src/cpu_detect_x86.cpp \' \
          '    src/mmx_optimized.cpp \' \
          '    src/sse_optimized.cpp' \
          'LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1 -msse -msse2 -mmmx' \
          'LOCAL_CPPFLAGS := -std=c++11' \
          'LOCAL_C_INCLUDES := $(LOCAL_PATH)/src' \
          'include $(BUILD_STATIC_LIBRARY)' \
          'endif' \
          '' \
          'include $(CLEAR_VARS)' \
          'LOCAL_MODULE := soundtouch' \
          'LOCAL_SRC_FILES := soundtouch-jni.cpp' \
          'LOCAL_STATIC_LIBRARIES := soundtouch_core' \
          '' \
          'ifneq ($(filter x86 x86_64, $(TARGET_ARCH_ABI)),)' \
          'LOCAL_STATIC_LIBRARIES += soundtouch_optimizations' \
          'else' \
          'LOCAL_SRC_FILES += src/cpu_detect_arm.cpp' \
          'endif' \
          '' \
          'LOCAL_LDLIBS := -llog -lz' \
          'LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1' \
          'LOCAL_CPPFLAGS := -std=c++11' \
          'LOCAL_C_INCLUDES := $(LOCAL_PATH)/src' \
          'include $(BUILD_SHARED_LIBRARY)' > Android.mk
      
      - name: Generate Application.mk
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          
          printf '%s\n' \
          'APP_PLATFORM := android-21' \
          'APP_ABI := armeabi-v7a arm64-v8a x86 x86_64' \
          'APP_STL := c++_shared' \
          'APP_CPPFLAGS := -std=c++11 -frtti -fexceptions' \
          'APP_CFLAGS := -O3 -DNDEBUG' \
          'APP_OPTIM := release' > Application.mk
      
      - name: Generate soundtouch-jni.cpp (COMPLETE - ALL METHODS)
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          
          printf '%s\n' \
          '#include <jni.h>' \
          '#include <android/log.h>' \
          '#include <string>' \
          '#include "src/SoundTouch.h"' \
          '' \
          '#define LOG_TAG "SoundTouch"' \
          '#define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)' \
          '#define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)' \
          '' \
          'using namespace soundtouch;' \
          'static std::string g_lastError = "";' \
          '' \
          'static void setError(const char* error) { g_lastError = error; LOGE("%s", error); }' \
          '' \
          '// ========== Instance Management ==========' \
          'extern "C" JNIEXPORT jlong JNICALL Java_net_surina_soundtouch_SoundTouch_newInstance(JNIEnv* env, jclass clazz) {' \
          '    SoundTouch* st = new SoundTouch();' \
          '    if (!st) { setError("Failed to allocate SoundTouch instance"); return 0; }' \
          '    st->clear();' \
          '    LOGD("SoundTouch instance created: %p", st);' \
          '    return reinterpret_cast<jlong>(st);' \
          '}' \
          '' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_deleteInstance(JNIEnv* env, jobject obj, jlong handle) {' \
          '    delete reinterpret_cast<SoundTouch*>(handle);' \
          '    LOGD("SoundTouch instance destroyed");' \
          '}' \
          '' \
          '// ========== Configuration ==========' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setSampleRate(JNIEnv* env, jobject obj, jlong handle, jint sampleRate) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) st->setSampleRate(static_cast<uint>(sampleRate));' \
          '}' \
          '' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setChannels(JNIEnv* env, jobject obj, jlong handle, jint channels) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) st->setChannels(static_cast<uint>(channels));' \
          '}' \
          '' \
          '// ========== Tempo Control ==========' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setTempo(JNIEnv* env, jobject obj, jlong handle, jfloat tempo) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->setTempo(static_cast<double>(tempo)); LOGD("Tempo: %.2f", tempo); }' \
          '}' \
          '' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setTempoChange(JNIEnv* env, jobject obj, jlong handle, jfloat tempoDelta) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->setTempoChange(static_cast<double>(tempoDelta)); LOGD("Tempo change: %.2f%%", tempoDelta); }' \
          '}' \
          '' \
          '// ========== Pitch Control ==========' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setPitchSemiTones(JNIEnv* env, jobject obj, jlong handle, jfloat pitch) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->setPitchSemiTones(static_cast<double>(pitch)); LOGD("Pitch: %.2f semitones", pitch); }' \
          '}' \
          '' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setPitchOctaves(JNIEnv* env, jobject obj, jlong handle, jfloat pitch) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->setPitchOctaves(static_cast<double>(pitch)); LOGD("Pitch: %.2f octaves", pitch); }' \
          '}' \
          '' \
          '// ========== Rate Control ==========' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setRate(JNIEnv* env, jobject obj, jlong handle, jfloat rate) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->setRate(static_cast<double>(rate)); LOGD("Rate: %.2f", rate); }' \
          '}' \
          '' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setRateChange(JNIEnv* env, jobject obj, jlong handle, jfloat rateDelta) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->setRateChange(static_cast<double>(rateDelta)); LOGD("Rate change: %.2f%%", rateDelta); }' \
          '}' \
          '' \
          '// ========== Streaming Methods ==========' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_putSamples(JNIEnv* env, jobject obj, jlong handle, jshortArray samples, jint numSamples) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (!st) { setError("putSamples: Invalid handle"); return; }' \
          '    jshort* sampleArray = env->GetShortArrayElements(samples, nullptr);' \
          '    if (sampleArray) {' \
          '        st->putSamples(reinterpret_cast<const SAMPLETYPE*>(sampleArray), static_cast<uint>(numSamples));' \
          '        env->ReleaseShortArrayElements(samples, sampleArray, JNI_ABORT);' \
          '    }' \
          '}' \
          '' \
          'extern "C" JNIEXPORT jint JNICALL Java_net_surina_soundtouch_SoundTouch_receiveSamples(JNIEnv* env, jobject obj, jlong handle, jshortArray buffer, jint maxSamples) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (!st) { setError("receiveSamples: Invalid handle"); return 0; }' \
          '    jshort* bufferArray = env->GetShortArrayElements(buffer, nullptr);' \
          '    if (!bufferArray) return 0;' \
          '    uint received = st->receiveSamples(reinterpret_cast<SAMPLETYPE*>(bufferArray), static_cast<uint>(maxSamples));' \
          '    env->ReleaseShortArrayElements(buffer, bufferArray, 0);' \
          '    return static_cast<jint>(received);' \
          '}' \
          '' \
          'extern "C" JNIEXPORT jint JNICALL Java_net_surina_soundtouch_SoundTouch_numSamples(JNIEnv* env, jobject obj, jlong handle) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    return st ? static_cast<jint>(st->numSamples()) : 0;' \
          '}' \
          '' \
          'extern "C" JNIEXPORT jboolean JNICALL Java_net_surina_soundtouch_SoundTouch_isEmpty(JNIEnv* env, jobject obj, jlong handle) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    return st ? st->isEmpty() : JNI_TRUE;' \
          '}' \
          '' \
          '// ========== Buffer Management ==========' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_clear(JNIEnv* env, jobject obj, jlong handle) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->clear(); LOGD("Buffers cleared"); }' \
          '}' \
          '' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_flush(JNIEnv* env, jobject obj, jlong handle) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->flush(); LOGD("Flushed"); }' \
          '}' \
          '' \
          '// ========== Settings ==========' \
          'extern "C" JNIEXPORT void JNICALL Java_net_surina_soundtouch_SoundTouch_setSetting(JNIEnv* env, jobject obj, jlong handle, jint settingId, jint value) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    if (st) { st->setSetting(settingId, value); LOGD("Setting %d = %d", settingId, value); }' \
          '}' \
          '' \
          'extern "C" JNIEXPORT jint JNICALL Java_net_surina_soundtouch_SoundTouch_getSetting(JNIEnv* env, jobject obj, jlong handle, jint settingId) {' \
          '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' \
          '    return st ? st->getSetting(settingId) : 0;' \
          '}' \
          '' \
          '// ========== Utility Methods ==========' \
          'extern "C" JNIEXPORT jstring JNICALL Java_net_surina_soundtouch_SoundTouch_getVersionString(JNIEnv* env, jclass clazz) {' \
          '    const char* version = SoundTouch::getVersionString();' \
          '    LOGD("SoundTouch version: %s", version);' \
          '    return env->NewStringUTF(version);' \
          '}' \
          '' \
          'extern "C" JNIEXPORT jstring JNICALL Java_net_surina_soundtouch_SoundTouch_getErrorString(JNIEnv* env, jclass clazz) {' \
          '    return env->NewStringUTF(g_lastError.c_str());' \
          '}' > soundtouch-jni.cpp
      
      - name: Build Native Libraries
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib"
          export PATH=$ANDROID_HOME/ndk/25.1.8937393:$PATH
          rm -rf libs/ obj/
          cd jni
          ndk-build -j4
          cd ..
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "libs/$abi/libsoundtouch.so" ]; then
              echo "✓ $abi/libsoundtouch.so"
              ls -lh "libs/$abi/libsoundtouch.so"
            else
              echo "✗ $abi/libsoundtouch.so not found"
              exit 1
            fi
          done
      
      - name: Generate SoundTouch.java (COMPLETE - ALL METHODS)
        run: |
          mkdir -p output/java/net/surina/soundtouch
          
          printf '%s\n' \
          'package net.surina.soundtouch;' \
          '' \
          'public final class SoundTouch {' \
          '    // ========== Native Methods ==========' \
          '    private static native long newInstance();' \
          '    private native void deleteInstance(long handle);' \
          '    private native void setSampleRate(long handle, int sampleRate);' \
          '    private native void setChannels(long handle, int channels);' \
          '    private native void setTempo(long handle, float tempo);' \
          '    private native void setTempoChange(long handle, float tempoDelta);' \
          '    private native void setPitchSemiTones(long handle, float pitch);' \
          '    private native void setPitchOctaves(long handle, float pitch);' \
          '    private native void setRate(long handle, float rate);' \
          '    private native void setRateChange(long handle, float rateDelta);' \
          '    private native void putSamples(long handle, short[] samples, int numSamples);' \
          '    private native int receiveSamples(long handle, short[] buffer, int maxSamples);' \
          '    private native int numSamples(long handle);' \
          '    private native boolean isEmpty(long handle);' \
          '    private native void clear(long handle);' \
          '    private native void flush(long handle);' \
          '    private native void setSetting(long handle, int settingId, int value);' \
          '    private native int getSetting(long handle, int settingId);' \
          '    public static native String getVersionString();' \
          '    public static native String getErrorString();' \
          '' \
          '    // ========== Setting Constants ==========' \
          '    public static final int SETTING_USE_AA_FILTER = 0;' \
          '    public static final int SETTING_AA_FILTER_LENGTH = 1;' \
          '    public static final int SETTING_USE_QUICKSEEK = 2;' \
          '    public static final int SETTING_SEQUENCE_MS = 3;' \
          '    public static final int SETTING_SEEKWINDOW_MS = 4;' \
          '    public static final int SETTING_OVERLAP_MS = 5;' \
          '' \
          '    static { System.loadLibrary("soundtouch"); }' \
          '' \
          '    private long handle = 0;' \
          '    private int mSampleRate = 0;' \
          '    private int mChannels = 0;' \
          '    private boolean mIsClosed = false;' \
          '' \
          '    public SoundTouch() {' \
          '        handle = newInstance();' \
          '        if (handle == 0) throw new RuntimeException("Failed to create SoundTouch instance");' \
          '    }' \
          '' \
          '    // ========== Configuration ==========' \
          '    public void setSampleRate(int sampleRate) { if (!mIsClosed) { mSampleRate = sampleRate; setSampleRate(handle, sampleRate); } }' \
          '    public int getSampleRate() { return mSampleRate; }' \
          '    public void setChannels(int channels) { if (!mIsClosed) { mChannels = channels; setChannels(handle, channels); } }' \
          '    public int getChannels() { return mChannels; }' \
          '' \
          '    // ========== Tempo Control ==========' \
          '    public void setTempo(float tempo) { if (!mIsClosed) setTempo(handle, tempo); }' \
          '    public void setTempoChange(float tempoDelta) { if (!mIsClosed) setTempoChange(handle, tempoDelta); }' \
          '' \
          '    // ========== Pitch Control ==========' \
          '    public void setPitchSemiTones(float pitch) { if (!mIsClosed) setPitchSemiTones(handle, pitch); }' \
          '    public void setPitchOctaves(float pitch) { if (!mIsClosed) setPitchOctaves(handle, pitch); }' \
          '' \
          '    // ========== Rate Control ==========' \
          '    public void setRate(float rate) { if (!mIsClosed) setRate(handle, rate); }' \
          '    public void setRateChange(float rateDelta) { if (!mIsClosed) setRateChange(handle, rateDelta); }' \
          '' \
          '    // ========== Streaming Methods ==========' \
          '    public void putSamples(short[] samples, int numSamples) { if (!mIsClosed) putSamples(handle, samples, numSamples); }' \
          '    public void putSamples(short[] samples) { putSamples(samples, samples.length); }' \
          '    public int receiveSamples(short[] buffer, int maxSamples) { return mIsClosed ? 0 : receiveSamples(handle, buffer, maxSamples); }' \
          '    public int receiveSamples(short[] buffer) { return receiveSamples(buffer, buffer.length); }' \
          '    public int numSamples() { return mIsClosed ? 0 : numSamples(handle); }' \
          '    public boolean hasSamples() { return numSamples() > 0; }' \
          '    public boolean isEmpty() { return mIsClosed ? true : isEmpty(handle); }' \
          '    public int process(short[] input, short[] output) { putSamples(input); return receiveSamples(output); }' \
          '' \
          '    // ========== Buffer Management ==========' \
          '    public void clear() { if (!mIsClosed) clear(handle); }' \
          '    public void flush() { if (!mIsClosed) flush(handle); }' \
          '' \
          '    // ========== Settings ==========' \
          '    public void setSetting(int settingId, int value) { if (!mIsClosed) setSetting(handle, settingId, value); }' \
          '    public int getSetting(int settingId) { return mIsClosed ? 0 : getSetting(handle, settingId); }' \
          '    public void setUseAntiAliasFilter(boolean enable) { setSetting(SETTING_USE_AA_FILTER, enable ? 1 : 0); }' \
          '    public void setUseQuickSeek(boolean enable) { setSetting(SETTING_USE_QUICKSEEK, enable ? 1 : 0); }' \
          '    public void setSequenceMs(int ms) { setSetting(SETTING_SEQUENCE_MS, ms); }' \
          '    public void setSeekWindowMs(int ms) { setSetting(SETTING_SEEKWINDOW_MS, ms); }' \
          '    public void setOverlapMs(int ms) { setSetting(SETTING_OVERLAP_MS, ms); }' \
          '' \
          '    // ========== Utility ==========' \
          '    public boolean isClosed() { return mIsClosed; }' \
          '    public void close() { if (!mIsClosed && handle != 0) { deleteInstance(handle); handle = 0; mIsClosed = true; } }' \
          '    public static boolean isAvailable() { try { return getVersionString() != null; } catch (UnsatisfiedLinkError e) { return false; } }' \
          '    @Override protected void finalize() throws Throwable { try { if (!mIsClosed && handle != 0) deleteInstance(handle); } finally { super.finalize(); } }' \
          '}' > output/java/net/surina/soundtouch/SoundTouch.java
      
      - name: Package Artifacts
        run: |
          mkdir -p output/jniLibs
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "$SOUNDTOUCH_ROOT/source/Android-lib/libs/$abi/libsoundtouch.so" ]; then
              mkdir -p "output/jniLibs/$abi"
              cp "$SOUNDTOUCH_ROOT/source/Android-lib/libs/$abi/libsoundtouch.so" "output/jniLibs/$abi/"
              echo "✓ Copied $abi/libsoundtouch.so"
            fi
          done
          
          printf '%s\n' \
          '# SoundTouch Android Libraries' \
          '' \
          '## Version: ${{ inputs.soundtouch_version }}' \
          '## Supported ABIs: armeabi-v7a, arm64-v8a, x86, x86_64' \
          '' \
          '## ALL METHODS INCLUDED:' \
          '- setSampleRate(), setChannels()' \
          '- setTempo(), setTempoChange()' \
          '- setPitchSemiTones(), setPitchOctaves()' \
          '- setRate(), setRateChange()' \
          '- putSamples(), receiveSamples(), numSamples(), isEmpty()' \
          '- clear(), flush()' \
          '- setSetting(), getSetting() (with constants)' \
          '- getVersionString(), getErrorString()' \
          '' \
          '## Installation:' \
          '1. Copy jniLibs/ to app/src/main/jniLibs/' \
          '2. Copy SoundTouch.java to app/src/main/java/net/surina/soundtouch/' > output/README.md
      
      - name: Upload SoundTouch Libraries
        uses: actions/upload-artifact@v6
        with:
          name: soundtouch-${{ inputs.soundtouch_version }}-android-libs-complete
          path: output/
          retention-days: 90
