# ============================================================================
# Build SoundTouch Android Native Library - Architecture-Aware Build
# ============================================================================
# 
# This workflow downloads the official SoundTouch source code and compiles it
# into native Android libraries (.so files) with complete streaming method
# support for real-time pitch and tempo control.
# 
# Features:
# - Full streaming API (putSamples, receiveSamples, numSamples, etc.)
# - Architecture-specific optimizations:
#   * ARM (armeabi-v7a, arm64-v8a): Core files only + ARM stub
#   * x86/x86_64: MMX/SSE optimizations included
# - Builds for all 4 ABIs
# - Produces stripped libraries (~70-100KB per ABI)
# 
# @author Richard Korbla Adzido
# @version 1.0.1
# @since 1.0
# ============================================================================

name: Build SoundTouch Native Library

on:
  workflow_dispatch:
    inputs:
      soundtouch_version:
        description: 'SoundTouch version'
        required: true
        default: '2.3.3'
        type: string

jobs:
  build-soundtouch:
    name: Build SoundTouch ${{ inputs.soundtouch_version }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      
      - name: Install NDK
        run: |
          echo "Installing Android NDK 25.1.8937393..."
          yes | sdkmanager "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      
      - name: Download SoundTouch Source
        run: |
          VERSION="${{ inputs.soundtouch_version }}"
          echo "Downloading SoundTouch $VERSION..."
          curl -L -o "soundtouch-$VERSION.tar.gz" "https://www.surina.net/soundtouch/soundtouch-$VERSION.tar.gz"
          tar -xzf "soundtouch-$VERSION.tar.gz"
          
          if [ -d "soundtouch" ]; then
            echo "SOUNDTOUCH_ROOT=soundtouch" >> $GITHUB_ENV
            echo "Extracted to: soundtouch/"
          else
            echo "ERROR: Could not find extracted directory"
            ls -la
            exit 1
          fi
      
      - name: Locate Source Files
        run: |
          echo "=========================================="
          echo "Locating SoundTouch Source Files"
          echo "=========================================="
          
          echo "Root: $SOUNDTOUCH_ROOT"
          
          # Find the directory containing the .cpp source files
          if [ -d "$SOUNDTOUCH_ROOT/source/SoundTouch" ]; then
            SOUNDTOUCH_CPP_DIR="$SOUNDTOUCH_ROOT/source/SoundTouch"
            echo "SOUNDTOUCH_CPP_DIR=$SOUNDTOUCH_CPP_DIR" >> $GITHUB_ENV
            echo "Found .cpp source directory: $SOUNDTOUCH_CPP_DIR"
          else
            echo "ERROR: source/SoundTouch directory not found"
            exit 1
          fi
          
          # Find the include directory with headers
          if [ -d "$SOUNDTOUCH_ROOT/include" ]; then
            SOUNDTOUCH_INCLUDE_DIR="$SOUNDTOUCH_ROOT/include"
            echo "SOUNDTOUCH_INCLUDE_DIR=$SOUNDTOUCH_INCLUDE_DIR" >> $GITHUB_ENV
            echo "Found include directory: $SOUNDTOUCH_INCLUDE_DIR"
          else
            echo "ERROR: include directory not found"
            exit 1
          fi
          
          # List all .cpp files
          echo ""
          echo "All .cpp files:"
          find "$SOUNDTOUCH_CPP_DIR" -name "*.cpp" -type f | sort
          
          CPP_COUNT=$(find "$SOUNDTOUCH_CPP_DIR" -name "*.cpp" -type f | wc -l)
          echo ""
          echo "Total .cpp files found: $CPP_COUNT"
      
      - name: Setup Android Build Directories
        run: |
          echo "Setting up Android build directories..."
          
          # Create Android library directory structure
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/libs"
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/obj"
          
          # Create src directory for all source files
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src"
          
          # Copy all .cpp files to src directory
          echo "Copying .cpp files..."
          find "$SOUNDTOUCH_CPP_DIR" -name "*.cpp" -type f | while read src; do
            filename=$(basename "$src")
            cp "$src" "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/"
            echo "  Copied: $filename"
          done
          
          # Copy all header files to src directory (so includes work)
          echo "Copying header files..."
          find "$SOUNDTOUCH_INCLUDE_DIR" -name "*.h" -type f | while read header; do
            filename=$(basename "$header")
            cp "$header" "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/"
            echo "  Copied: $filename"
          done
          
          # Also copy headers from source directory if present
          find "$SOUNDTOUCH_CPP_DIR" -name "*.h" -type f 2>/dev/null | while read header; do
            filename=$(basename "$header")
            cp "$header" "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/"
            echo "  Copied from cpp dir: $filename"
          done
          
          # Create ARM stub for CPU detection (fixes undefined symbol error)
          echo "Creating ARM stub for CPU detection..."
          cat > "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp" << 'EOFARM'
// cpu_detect_arm.cpp - Stub implementation for ARM platforms
// ARM does not support MMX/SSE instructions, so CPU detection always returns 0

#include "cpu_detect.h"

namespace soundtouch
{
    uint detectCPUextensions(void)
    {
        // No x86 extensions available on ARM
        return 0;
    }
}
EOFARM
          
          echo "Created: cpu_detect_arm.cpp"
          
          echo ""
          echo "Contents of jni/src/:"
          ls -la "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/"
      
      - name: Generate Android.mk (Architecture-Aware with ARM Stubs)
        run: |
          echo "Generating Android.mk with architecture-aware optimizations and ARM stubs..."
          
          cd "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          
          cat > Android.mk << 'EOF'
          LOCAL_PATH := $(call my-dir)
          
          # ============================================================================
          # SoundTouch Core Library (all architectures)
          # ============================================================================
          include $(CLEAR_VARS)
          LOCAL_MODULE := soundtouch_core
          LOCAL_SRC_FILES := \
              src/AAFilter.cpp \
              src/BPMDetect.cpp \
              src/FIFOSampleBuffer.cpp \
              src/FIRFilter.cpp \
              src/InterpolateCubic.cpp \
              src/InterpolateLinear.cpp \
              src/InterpolateShannon.cpp \
              src/PeakFinder.cpp \
              src/RateTransposer.cpp \
              src/SoundTouch.cpp \
              src/TDStretch.cpp
          
          LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti
          LOCAL_CFLAGS += -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1
          LOCAL_CPPFLAGS := -std=c++11
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/src
          include $(BUILD_STATIC_LIBRARY)
          
          # ============================================================================
          # x86/x86_64 Optimizations (MMX/SSE)
          # ============================================================================
          ifneq ($(filter x86 x86_64, $(TARGET_ARCH_ABI)),)
          include $(CLEAR_VARS)
          LOCAL_MODULE := soundtouch_optimizations
          LOCAL_SRC_FILES := \
              src/cpu_detect_x86.cpp \
              src/mmx_optimized.cpp \
              src/sse_optimized.cpp
          LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti
          LOCAL_CFLAGS += -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1
          LOCAL_CFLAGS += -msse -msse2 -mmmx
          LOCAL_CPPFLAGS := -std=c++11
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/src
          include $(BUILD_STATIC_LIBRARY)
          endif
          
          # ============================================================================
          # ARM CPU Detection Stub (required for FIRFilter and TDStretch)
          # ============================================================================
          ifneq ($(filter armeabi-v7a arm64-v8a, $(TARGET_ARCH_ABI)),)
          include $(CLEAR_VARS)
          LOCAL_MODULE := soundtouch_arm_stubs
          LOCAL_SRC_FILES := src/cpu_detect_arm.cpp
          LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti
          LOCAL_CFLAGS += -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1
          LOCAL_CPPFLAGS := -std=c++11
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/src
          include $(BUILD_STATIC_LIBRARY)
          endif
          
          # ============================================================================
          # JNI Wrapper Library (links appropriate static libraries)
          # ============================================================================
          include $(CLEAR_VARS)
          LOCAL_MODULE := soundtouch
          LOCAL_SRC_FILES := soundtouch-jni.cpp
          LOCAL_STATIC_LIBRARIES := soundtouch_core
          
          # Add x86 optimizations for x86/x86_64 only
          ifneq ($(filter x86 x86_64, $(TARGET_ARCH_ABI)),)
          LOCAL_STATIC_LIBRARIES += soundtouch_optimizations
          endif
          
          # Add ARM stubs for ARM architectures
          ifneq ($(filter armeabi-v7a arm64-v8a, $(TARGET_ARCH_ABI)),)
          LOCAL_STATIC_LIBRARIES += soundtouch_arm_stubs
          endif
          
          LOCAL_LDLIBS := -llog -lz
          LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti
          LOCAL_CFLAGS += -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1
          LOCAL_CPPFLAGS := -std=c++11
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/src
          include $(BUILD_SHARED_LIBRARY)
          EOF
          
          echo "Android.mk generated"
          echo "Contents:"
          cat Android.mk
      
      - name: Generate Application.mk
        run: |
          cat > "$SOUNDTOUCH_ROOT/source/Android-lib/jni/Application.mk" << 'EOF'
          APP_PLATFORM := android-21
          APP_ABI := armeabi-v7a arm64-v8a x86 x86_64
          APP_STL := c++_shared
          APP_CPPFLAGS := -std=c++11 -frtti -fexceptions
          APP_CFLAGS := -O3 -DNDEBUG
          APP_OPTIM := release
          EOF
          
          echo "Application.mk generated"
          cat "$SOUNDTOUCH_ROOT/source/Android-lib/jni/Application.mk"
      
      - name: Generate soundtouch-jni.cpp
        run: |
          cat > "$SOUNDTOUCH_ROOT/source/Android-lib/jni/soundtouch-jni.cpp" << 'EOF'
          /**
           * SoundTouch Android JNI Wrapper - Complete Streaming Interface
           * ============================================================================
           * 
           * This file implements the complete JNI bridge for SoundTouch with all
           * streaming methods required for real-time audio processing.
           * 
           * @author Olli Parviainen (SoundTouch)
           * @author Richard Korbla Adzido (JNI wrapper)
           * @version 2.3.3
           * @since 1.0
           */
          
          #include <jni.h>
          #include <android/log.h>
          #include <string>
          #include "src/SoundTouch.h"
          
          #define LOG_TAG "SoundTouch"
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)
          
          using namespace soundtouch;
          static std::string g_lastError = "";
          
          static void setError(const char* error) {
              g_lastError = error;
              LOGE("%s", error);
          }
          
          static void clearError() {
              g_lastError.clear();
          }
          
          // ============================================================================
          // Instance Management
          // ============================================================================
          
          extern "C" JNIEXPORT jlong JNICALL
          Java_net_surina_soundtouch_SoundTouch_newInstance(JNIEnv* env, jclass clazz) {
              clearError();
              SoundTouch* st = new SoundTouch();
              if (st == nullptr) {
                  setError("Failed to allocate SoundTouch instance");
                  return 0;
              }
              st->clear();
              LOGD("SoundTouch instance created: %p", st);
              return reinterpret_cast<jlong>(st);
          }
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_deleteInstance(JNIEnv* env, jobject obj, jlong handle) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st != nullptr) {
                  LOGD("SoundTouch instance destroyed: %p", st);
                  delete st;
              }
          }
          
          // ============================================================================
          // Configuration Methods
          // ============================================================================
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_setSampleRate(JNIEnv* env, jobject obj, jlong handle, jint sampleRate) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("setSampleRate: Invalid handle");
                  return;
              }
              st->setSampleRate(static_cast<uint>(sampleRate));
              LOGD("Sample rate set to %d Hz", sampleRate);
          }
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_setChannels(JNIEnv* env, jobject obj, jlong handle, jint channels) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("setChannels: Invalid handle");
                  return;
              }
              st->setChannels(static_cast<uint>(channels));
              LOGD("Channels set to %d", channels);
          }
          
          // ============================================================================
          // Parameter Control Methods
          // ============================================================================
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_setTempo(JNIEnv* env, jobject obj, jlong handle, jfloat tempo) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("setTempo: Invalid handle");
                  return;
              }
              st->setTempo(static_cast<double>(tempo));
              LOGD("Tempo set to %.2f", tempo);
          }
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_setPitchSemiTones(JNIEnv* env, jobject obj, jlong handle, jfloat pitch) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("setPitchSemiTones: Invalid handle");
                  return;
              }
              st->setPitchSemiTones(static_cast<double>(pitch));
              LOGD("Pitch set to %.2f semitones", pitch);
          }
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_setRate(JNIEnv* env, jobject obj, jlong handle, jfloat rate) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("setRate: Invalid handle");
                  return;
              }
              st->setRate(static_cast<double>(rate));
              LOGD("Rate set to %.2f", rate);
          }
          
          // ============================================================================
          // Streaming Processing Methods
          // ============================================================================
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_putSamples(JNIEnv* env, jobject obj, jlong handle, jshortArray samples, jint numSamples) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("putSamples: Invalid handle");
                  return;
              }
              if (samples == nullptr) {
                  setError("putSamples: Null sample array");
                  return;
              }
              jshort* sampleArray = env->GetShortArrayElements(samples, nullptr);
              if (sampleArray == nullptr) {
                  setError("putSamples: Failed to get sample array");
                  return;
              }
              st->putSamples(reinterpret_cast<const SAMPLETYPE*>(sampleArray), static_cast<uint>(numSamples));
              env->ReleaseShortArrayElements(samples, sampleArray, JNI_ABORT);
          }
          
          extern "C" JNIEXPORT jint JNICALL
          Java_net_surina_soundtouch_SoundTouch_receiveSamples(JNIEnv* env, jobject obj, jlong handle, jshortArray buffer, jint maxSamples) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("receiveSamples: Invalid handle");
                  return 0;
              }
              if (buffer == nullptr) {
                  setError("receiveSamples: Null buffer array");
                  return 0;
              }
              jshort* bufferArray = env->GetShortArrayElements(buffer, nullptr);
              if (bufferArray == nullptr) {
                  setError("receiveSamples: Failed to get buffer array");
                  return 0;
              }
              uint received = st->receiveSamples(reinterpret_cast<SAMPLETYPE*>(bufferArray), static_cast<uint>(maxSamples));
              env->ReleaseShortArrayElements(buffer, bufferArray, 0);
              return static_cast<jint>(received);
          }
          
          extern "C" JNIEXPORT jint JNICALL
          Java_net_surina_soundtouch_SoundTouch_numSamples(JNIEnv* env, jobject obj, jlong handle) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("numSamples: Invalid handle");
                  return 0;
              }
              return static_cast<jint>(st->numSamples());
          }
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_clear(JNIEnv* env, jobject obj, jlong handle) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("clear: Invalid handle");
                  return;
              }
              st->clear();
              LOGD("SoundTouch buffers cleared");
          }
          
          extern "C" JNIEXPORT void JNICALL
          Java_net_surina_soundtouch_SoundTouch_flush(JNIEnv* env, jobject obj, jlong handle) {
              SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);
              if (st == nullptr) {
                  setError("flush: Invalid handle");
                  return;
              }
              st->flush();
              LOGD("SoundTouch flushed");
          }
          
          // ============================================================================
          // Utility Methods
          // ============================================================================
          
          extern "C" JNIEXPORT jstring JNICALL
          Java_net_surina_soundtouch_SoundTouch_getVersionString(JNIEnv* env, jclass clazz) {
              const char* version = SoundTouch::getVersionString();
              LOGD("SoundTouch version: %s", version);
              return env->NewStringUTF(version);
          }
          
          extern "C" JNIEXPORT jstring JNICALL
          Java_net_surina_soundtouch_SoundTouch_getErrorString(JNIEnv* env, jclass clazz) {
              return env->NewStringUTF(g_lastError.c_str());
          }
          EOF
          
          echo "soundtouch-jni.cpp generated"
          echo "File size: $(wc -l < "$SOUNDTOUCH_ROOT/source/Android-lib/jni/soundtouch-jni.cpp") lines"
      
      - name: Build Native Libraries
        run: |
          echo "=========================================="
          echo "Building SoundTouch Native Libraries"
          echo "=========================================="
          
          cd "$SOUNDTOUCH_ROOT/source/Android-lib"
          
          export PATH=$ANDROID_HOME/ndk/25.1.8937393:$PATH
          
          echo "NDK Path: $ANDROID_HOME/ndk/25.1.8937393"
          echo "Current directory: $(pwd)"
          echo ""
          
          # Clean previous build
          rm -rf libs/ obj/
          
          echo "Starting NDK build..."
          cd jni
          
          echo "Android.mk:"
          cat Android.mk
          echo ""
          
          ndk-build -j4
          
          if [ $? -eq 0 ]; then
            echo ""
            echo "✓ Build successful!"
          else
            echo ""
            echo "✗ Build failed!"
            exit 1
          fi
          
          cd ..
          echo ""
          echo "Build output:"
          ls -la libs/
          echo ""
          
          # Show sizes and verify symbols
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "libs/$abi/libsoundtouch.so" ]; then
              SIZE=$(ls -lh "libs/$abi/libsoundtouch.so" | awk '{print $5}')
              echo "✓ $abi/libsoundtouch.so ($SIZE)"
            else
              echo "✗ $abi/libsoundtouch.so not found"
            fi
          done
      
      - name: Verify Library Symbols
        run: |
          echo "=========================================="
          echo "Verifying Library Symbols"
          echo "=========================================="
          
          cd "$SOUNDTOUCH_ROOT/source/Android-lib"
          
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            SO_FILE="libs/$abi/libsoundtouch.so"
            if [ -f "$SO_FILE" ]; then
              echo ""
              echo "$abi/libsoundtouch.so:"
              
              # Check for key streaming symbols
              if command -v readelf &> /dev/null; then
                SYMBOLS=$(readelf -Ws "$SO_FILE" 2>/dev/null | grep -c "Java_net_surina_soundtouch_SoundTouch_" || echo "0")
                echo "  JNI symbols found: $SYMBOLS"
                
                # List key methods
                echo "  Key methods:"
                readelf -Ws "$SO_FILE" 2>/dev/null | grep "Java_net_surina_soundtouch_SoundTouch_" | sed 's/.*Java_/    Java_/' | head -10
              fi
            fi
          done
      
      - name: Generate SoundTouch.java
        run: |
          mkdir -p output/java/net/surina/soundtouch
          
          cat > output/java/net/surina/soundtouch/SoundTouch.java << 'EOF'
          /**
           * SoundTouch - Complete Java wrapper for the SoundTouch native library
           * ============================================================================
           * 
           * This class provides the complete JNI interface to the SoundTouch native library
           * for real-time pitch and tempo shifting of 16-bit PCM audio.
           * 
           * @author Olli Parviainen (SoundTouch)
           * @author Richard Korbla Adzido (Java wrapper)
           * @version 2.3.3
           * @since 1.0
           */
          package net.surina.soundtouch;

          public final class SoundTouch {
              
              // ========================================================================
              // Native Method Declarations
              // ========================================================================
              
              private static native long newInstance();
              private native void deleteInstance(long handle);
              private native void setSampleRate(long handle, int sampleRate);
              private native void setChannels(long handle, int channels);
              private native void setTempo(long handle, float tempo);
              private native void setPitchSemiTones(long handle, float pitch);
              private native void setRate(long handle, float rate);
              private native void putSamples(long handle, short[] samples, int numSamples);
              private native int receiveSamples(long handle, short[] buffer, int maxSamples);
              private native int numSamples(long handle);
              private native void clear(long handle);
              private native void flush(long handle);
              public static native String getVersionString();
              public static native String getErrorString();
              
              // ========================================================================
              // Static Initializer
              // ========================================================================
              
              static {
                  System.loadLibrary("soundtouch");
              }
              
              // ========================================================================
              // Member Variables
              // ========================================================================
              
              private long handle = 0;
              private int mSampleRate = 0;
              private int mChannels = 0;
              private boolean mIsClosed = false;
              
              // ========================================================================
              // Constructor
              // ========================================================================
              
              /**
               * Constructs a new SoundTouch processor instance.
               * 
               * @throws RuntimeException if the native instance cannot be created
               */
              public SoundTouch() {
                  handle = newInstance();
                  if (handle == 0) {
                      throw new RuntimeException("Failed to create SoundTouch instance");
                  }
              }
              
              // ========================================================================
              // Configuration Methods
              // ========================================================================
              
              /**
               * Sets the audio sample rate.
               * 
               * @param sampleRate Sample rate in Hz (8000 to 192000)
               */
              public void setSampleRate(int sampleRate) {
                  if (!mIsClosed) {
                      mSampleRate = sampleRate;
                      setSampleRate(handle, sampleRate);
                  }
              }
              
              /**
               * Sets the number of audio channels.
               * 
               * @param channels 1 for mono, 2 for stereo
               */
              public void setChannels(int channels) {
                  if (!mIsClosed) {
                      mChannels = channels;
                      setChannels(handle, channels);
                  }
              }
              
              /**
               * Sets the tempo multiplier.
               * 
               * @param tempo Tempo multiplier (0.5 to 1.5 recommended)
               */
              public void setTempo(float tempo) {
                  if (!mIsClosed) setTempo(handle, tempo);
              }
              
              /**
               * Sets the pitch shift in semitones.
               * 
               * @param pitch Pitch shift amount (-6 to +6 recommended)
               */
              public void setPitchSemiTones(float pitch) {
                  if (!mIsClosed) setPitchSemiTones(handle, pitch);
              }
              
              /**
               * Sets the playback rate (affects both tempo and pitch).
               * 
               * @param rate Playback rate multiplier
               */
              public void setRate(float rate) {
                  if (!mIsClosed) setRate(handle, rate);
              }
              
              // ========================================================================
              // Streaming Processing Methods
              // ========================================================================
              
              /**
               * Feeds PCM samples into the processor for real-time processing.
               * 
               * @param samples Array of 16-bit PCM samples
               * @param numSamples Number of samples to process
               */
              public void putSamples(short[] samples, int numSamples) {
                  if (!mIsClosed) putSamples(handle, samples, numSamples);
              }
              
              /**
               * Retrieves processed samples from the processor.
               * 
               * @param buffer Array to receive the processed samples
               * @param maxSamples Maximum number of samples to retrieve
               * @return Number of samples actually retrieved
               */
              public int receiveSamples(short[] buffer, int maxSamples) {
                  return mIsClosed ? 0 : receiveSamples(handle, buffer, maxSamples);
              }
              
              /**
               * Returns the number of samples available in the output buffer.
               * 
               * @return Number of available samples
               */
              public int numSamples() {
                  return mIsClosed ? 0 : numSamples(handle);
              }
              
              /**
               * Clears all internal buffers and resets processor state.
               */
              public void clear() {
                  if (!mIsClosed) clear(handle);
              }
              
              /**
               * Flushes any remaining samples from the processor.
               */
              public void flush() {
                  if (!mIsClosed) flush(handle);
              }
              
              // ========================================================================
              // Getter Methods
              // ========================================================================
              
              /**
               * Returns the sample rate currently configured.
               * 
               * @return Sample rate in Hz, or 0 if not set
               */
              public int getSampleRate() { return mSampleRate; }
              
              /**
               * Returns the channel count currently configured.
               * 
               * @return Number of channels (1 or 2), or 0 if not set
               */
              public int getChannels() { return mChannels; }
              
              /**
               * Checks whether the processor has been closed.
               * 
               * @return true if closed, false otherwise
               */
              public boolean isClosed() { return mIsClosed; }
              
              // ========================================================================
              // Resource Management
              // ========================================================================
              
              /**
               * Releases the native SoundTouch processor and frees all resources.
               */
              public void close() {
                  if (!mIsClosed && handle != 0) {
                      deleteInstance(handle);
                      handle = 0;
                      mIsClosed = true;
                  }
              }
              
              /**
               * Checks if the native library is available for use.
               * 
               * @return true if the native library is available, false otherwise
               */
              public static boolean isAvailable() {
                  try {
                      String version = getVersionString();
                      return version != null && !version.isEmpty();
                  } catch (UnsatisfiedLinkError e) {
                      return false;
                  }
              }
              
              @Override
              protected void finalize() throws Throwable {
                  try {
                      if (!mIsClosed && handle != 0) {
                          deleteInstance(handle);
                          handle = 0;
                      }
                  } finally {
                      super.finalize();
                  }
              }
          }
          EOF
          
          echo "SoundTouch.java generated"
          echo "File size: $(wc -l < output/java/net/surina/soundtouch/SoundTouch.java) lines"
      
      - name: Package Artifacts
        run: |
          echo "=========================================="
          echo "Packaging Build Artifacts"
          echo "=========================================="
          
          mkdir -p output/jniLibs
          
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            SOURCE_FILE="$SOUNDTOUCH_ROOT/source/Android-lib/libs/$abi/libsoundtouch.so"
            if [ -f "$SOURCE_FILE" ]; then
              mkdir -p "output/jniLibs/$abi"
              cp "$SOURCE_FILE" "output/jniLibs/$abi/"
              SIZE=$(ls -lh "$SOURCE_FILE" | awk '{print $5}')
              echo "✓ Copied $abi/libsoundtouch.so ($SIZE)"
            else
              echo "⚠ Warning: $abi/libsoundtouch.so not found"
            fi
          done
          
          # Create README
          cat > output/README.md << 'EOF'
          # SoundTouch Android Libraries

          This package contains the complete SoundTouch native libraries (.so files)
          and Java wrapper built from official source with full streaming method support.

          ## Version Information
          - SoundTouch: 2.3.3
          - Supported ABIs: armeabi-v7a, arm64-v8a, x86, x86_64

          ## Architecture Optimizations
          - ARM (armeabi-v7a, arm64-v8a): Core SoundTouch algorithms + ARM stub
          - x86/x86_64: Core algorithms + MMX/SSE optimizations

          ## Included Methods
          - setSampleRate(), setChannels() - Configuration
          - setTempo(), setPitchSemiTones(), setRate() - Parameter control
          - putSamples(), receiveSamples(), numSamples() - Streaming
          - clear(), flush() - Buffer management
          - getVersionString(), getErrorString() - Utility

          ## Installation
          1. Copy `jniLibs/` to `app/src/main/jniLibs/`
          2. Copy `java/net/surina/soundtouch/SoundTouch.java` to `app/src/main/java/net/surina/soundtouch/`

          ## Verification
          ```java
          SoundTouch st = new SoundTouch();
          st.setSampleRate(44100);
          st.setChannels(2);
          st.setTempo(1.25f);
          st.setPitchSemiTones(2.0f);
          Log.d("SoundTouch", "Version: " + st.getVersionString());
          st.close();
          ```

          ## License
          SoundTouch is licensed under LGPL. See https://www.surina.net/soundtouch/
          EOF
          
          echo ""
          echo "Final artifact structure:"
          find output -type f | sort
      
      - name: Upload SoundTouch Libraries
        uses: actions/upload-artifact@v6
        with:
          name: soundtouch-${{ inputs.soundtouch_version }}-android-libs
          path: output/
          retention-days: 90
          compression-level: 9
      
