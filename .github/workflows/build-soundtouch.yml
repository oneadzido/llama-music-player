          echo "  - jniLibs/arm64-v8a/libsoundtouch.so"
          echo "  - jniLibs/x86/libsoundtouch.so"
          echo "  - jniLibs/x86_64/libsoundtouch.so"
          echo "  - java/net/surina/soundtouch/SoundTouch.java"
          echo "  - README.md"
          echo ""
          echo "Next steps:"
          echo "  1. Download the artifact"
          echo "  2. Extract the zip file"
          echo "  3. Copy jniLibs/ to your Android project's app/src/main/"
