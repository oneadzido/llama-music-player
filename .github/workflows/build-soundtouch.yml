      - name: Package Artifacts
        run: |
          mkdir -p output/jniLibs
          
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "$SOUNDTOUCH_ROOT/source/Android-lib/libs/$abi/libsoundtouch.so" ]; then
              mkdir -p "output/jniLibs/$abi"
              cp "$SOUNDTOUCH_ROOT/source/Android-lib/libs/$abi/libsoundtouch.so" "output/jniLibs/$abi/"
              echo "✓ Copied $abi/libsoundtouch.so"
            fi
          done
          
          cat > output/README.md << 'README'
          # SoundTouch Android Libraries v1.0
          
          ## Overview
          This package contains the complete SoundTouch native libraries (.so files)
          and Java wrapper for real-time pitch and tempo control of 16-bit PCM audio.
          
          ## Version Information
          - **SoundTouch**: 2.3.3
          - **Wrapper Version**: 1.0.0
          - **Supported ABIs**: armeabi-v7a, arm64-v8a, x86, x86_64
          
          ## Features
          - Independent tempo control (0.5x to 2.0x)
          - Independent pitch control (-12 to +12 semitones)
          - Independent rate control (0.5x to 2.0x)
          - Streaming API for real-time processing
          - High-quality WSOLA algorithm
          - Anti-alias filtering
          
          ## Installation
          
          1. Copy `jniLibs/` to `app/src/main/jniLibs/`
          2. Copy `java/net/surina/soundtouch/SoundTouch.java` to `app/src/main/java/net/surina/soundtouch/`
          
          ## Quick Start
          
          ```java
          // Create processor
          SoundTouch st = new SoundTouch();
          
          // Configure
          st.setSampleRate(44100);
          st.setChannels(2);
          st.setTempo(1.25f);      // 25% faster
          st.setPitchSemiTones(2.0f); // +2 semitones
          
          // Process audio
          short[] input = new short[1024];
          short[] output = new short[2048];
          st.putSamples(input, input.length);
          int received = st.receiveSamples(output, output.length);
          
          // Clean up
          st.close();
          ```
          
          ## API Reference
          
          ### Configuration
          - `setSampleRate(int)` - Set sample rate in Hz
          - `setChannels(int)` - Set channels (1=mono, 2=stereo)
          
          ### Effects
          - `setTempo(float)` - Set tempo multiplier
          - `setTempoChange(float)` - Set tempo percentage change
          - `setPitchSemiTones(float)` - Set pitch in semitones
          - `setPitchOctaves(float)` - Set pitch in octaves
          - `setRate(float)` - Set playback rate
          - `setRateChange(float)` - Set rate percentage change
          
          ### Streaming
          - `putSamples(short[], int)` - Feed input samples
          - `receiveSamples(short[], int)` - Retrieve output samples
          - `numSamples()` - Get available output samples
          - `isEmpty()` - Check if output buffer is empty
          - `clear()` - Clear all buffers
          - `flush()` - Flush remaining samples
          
          ### Settings
          - `setUseAntiAliasFilter(boolean)` - Enable/disable AA filter
          - `setUseQuickSeek(boolean)` - Enable/disable quick seek
          - `setSequenceMs(int)` - Set sequence duration
          - `setSeekWindowMs(int)` - Set seek window
          - `setOverlapMs(int)` - Set overlap length
          
          ### Utilities
          - `getVersionString()` - Get library version
          - `getErrorString()` - Get last error
          - `isAvailable()` - Check if library is available
          - `close()` - Release resources
          
          ## License
          SoundTouch is licensed under LGPL v2.1.
          https://www.surina.net/soundtouch/
          
          ## Author
          Richard Korbla Adzido
          Llama Music Player
          README
          
