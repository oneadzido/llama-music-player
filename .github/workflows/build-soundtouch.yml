# ============================================================================
# Build SoundTouch Android Native Library - Complete with ALL Methods
# ============================================================================

name: Build SoundTouch Native Library

on:
  workflow_dispatch:
    inputs:
      soundtouch_version:
        description: 'SoundTouch version'
        required: true
        default: '2.3.3'
        type: string

jobs:
  build-soundtouch:
    name: Build SoundTouch ${{ inputs.soundtouch_version }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      
      - name: Install NDK
        run: |
          yes | sdkmanager "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      
      - name: Download SoundTouch Source
        run: |
          VERSION="${{ inputs.soundtouch_version }}"
          curl -L -o "soundtouch-$VERSION.tar.gz" "https://www.surina.net/soundtouch/soundtouch-$VERSION.tar.gz"
          tar -xzf "soundtouch-$VERSION.tar.gz"
          echo "SOUNDTOUCH_ROOT=soundtouch" >> $GITHUB_ENV
      
      - name: Locate Source Files
        run: |
          echo "SOUNDTOUCH_CPP_DIR=$SOUNDTOUCH_ROOT/source/SoundTouch" >> $GITHUB_ENV
          echo "SOUNDTOUCH_INCLUDE_DIR=$SOUNDTOUCH_ROOT/include" >> $GITHUB_ENV
      
      - name: Setup Android Build Directories
        run: |
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src"
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/libs"
          mkdir -p "$SOUNDTOUCH_ROOT/source/Android-lib/obj"
          
          find "$SOUNDTOUCH_CPP_DIR" -name "*.cpp" -type f -exec cp {} "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/" \;
          find "$SOUNDTOUCH_INCLUDE_DIR" -name "*.h" -type f -exec cp {} "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/" \;
          find "$SOUNDTOUCH_CPP_DIR" -name "*.h" -type f -exec cp {} "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/" \; 2>/dev/null
          
          echo '#include "cpu_detect.h"' > "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
          echo '' >> "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
          echo 'namespace soundtouch {' >> "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
          echo '    uint detectCPUextensions() {' >> "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
          echo '        return 0;' >> "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
          echo '    }' >> "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
          echo '}' >> "$SOUNDTOUCH_ROOT/source/Android-lib/jni/src/cpu_detect_arm.cpp"
      
      - name: Generate Android.mk
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          
          echo 'LOCAL_PATH := $(call my-dir)' > Android.mk
          echo '' >> Android.mk
          echo 'include $(CLEAR_VARS)' >> Android.mk
          echo 'LOCAL_MODULE := soundtouch_core' >> Android.mk
          echo 'LOCAL_SRC_FILES := \' >> Android.mk
          echo '    src/AAFilter.cpp \' >> Android.mk
          echo '    src/BPMDetect.cpp \' >> Android.mk
          echo '    src/FIFOSampleBuffer.cpp \' >> Android.mk
          echo '    src/FIRFilter.cpp \' >> Android.mk
          echo '    src/InterpolateCubic.cpp \' >> Android.mk
          echo '    src/InterpolateLinear.cpp \' >> Android.mk
          echo '    src/InterpolateShannon.cpp \' >> Android.mk
          echo '    src/PeakFinder.cpp \' >> Android.mk
          echo '    src/RateTransposer.cpp \' >> Android.mk
          echo '    src/SoundTouch.cpp \' >> Android.mk
          echo '    src/TDStretch.cpp' >> Android.mk
          echo 'LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1' >> Android.mk
          echo 'LOCAL_CPPFLAGS := -std=c++11' >> Android.mk
          echo 'LOCAL_C_INCLUDES := $(LOCAL_PATH)/src' >> Android.mk
          echo 'include $(BUILD_STATIC_LIBRARY)' >> Android.mk
          echo '' >> Android.mk
          echo 'ifneq ($(filter x86 x86_64, $(TARGET_ARCH_ABI)),)' >> Android.mk
          echo 'include $(CLEAR_VARS)' >> Android.mk
          echo 'LOCAL_MODULE := soundtouch_optimizations' >> Android.mk
          echo 'LOCAL_SRC_FILES := \' >> Android.mk
          echo '    src/cpu_detect_x86.cpp \' >> Android.mk
          echo '    src/mmx_optimized.cpp \' >> Android.mk
          echo '    src/sse_optimized.cpp' >> Android.mk
          echo 'LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1 -msse -msse2 -mmmx' >> Android.mk
          echo 'LOCAL_CPPFLAGS := -std=c++11' >> Android.mk
          echo 'LOCAL_C_INCLUDES := $(LOCAL_PATH)/src' >> Android.mk
          echo 'include $(BUILD_STATIC_LIBRARY)' >> Android.mk
          echo 'endif' >> Android.mk
          echo '' >> Android.mk
          echo 'include $(CLEAR_VARS)' >> Android.mk
          echo 'LOCAL_MODULE := soundtouch' >> Android.mk
          echo 'LOCAL_SRC_FILES := soundtouch-jni.cpp' >> Android.mk
          echo 'LOCAL_STATIC_LIBRARIES := soundtouch_core' >> Android.mk
          echo '' >> Android.mk
          echo 'ifneq ($(filter x86 x86_64, $(TARGET_ARCH_ABI)),)' >> Android.mk
          echo 'LOCAL_STATIC_LIBRARIES += soundtouch_optimizations' >> Android.mk
          echo 'else' >> Android.mk
          echo 'LOCAL_SRC_FILES += src/cpu_detect_arm.cpp' >> Android.mk
          echo 'endif' >> Android.mk
          echo '' >> Android.mk
          echo 'LOCAL_LDLIBS := -llog -lz' >> Android.mk
          echo 'LOCAL_CFLAGS := -O3 -DNDEBUG -fexceptions -frtti -DANDROID -DSOUNDTOUCH_INTEGER_SAMPLES=1' >> Android.mk
          echo 'LOCAL_CPPFLAGS := -std=c++11' >> Android.mk
          echo 'LOCAL_C_INCLUDES := $(LOCAL_PATH)/src' >> Android.mk
          echo 'include $(BUILD_SHARED_LIBRARY)' >> Android.mk
      
      - name: Generate Application.mk
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          
          echo 'APP_PLATFORM := android-21' > Application.mk
          echo 'APP_ABI := armeabi-v7a arm64-v8a x86 x86_64' >> Application.mk
          echo 'APP_STL := c++_shared' >> Application.mk
          echo 'APP_CPPFLAGS := -std=c++11 -frtti -fexceptions' >> Application.mk
          echo 'APP_CFLAGS := -O3 -DNDEBUG' >> Application.mk
          echo 'APP_OPTIM := release' >> Application.mk
      
      - name: Generate soundtouch-jni.cpp (COMPLETE - ALL METHODS)
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib/jni"
          
          echo '#include <jni.h>' > soundtouch-jni.cpp
          echo '#include <android/log.h>' >> soundtouch-jni.cpp
          echo '#include <string>' >> soundtouch-jni.cpp
          echo '#include "src/SoundTouch.h"' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '#define LOG_TAG "SoundTouch"' >> soundtouch-jni.cpp
          echo '#define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)' >> soundtouch-jni.cpp
          echo '#define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'using namespace soundtouch;' >> soundtouch-jni.cpp
          echo 'static std::string g_lastError = "";' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'static void setError(const char* error) {' >> soundtouch-jni.cpp
          echo '    g_lastError = error;' >> soundtouch-jni.cpp
          echo '    LOGE("%s", error);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Instance Management ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT jlong JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_newInstance(JNIEnv* env, jclass clazz) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = new SoundTouch();' >> soundtouch-jni.cpp
          echo '    if (st == nullptr) { setError("Failed to allocate SoundTouch instance"); return 0; }' >> soundtouch-jni.cpp
          echo '    st->clear();' >> soundtouch-jni.cpp
          echo '    LOGD("SoundTouch instance created: %p", st);' >> soundtouch-jni.cpp
          echo '    return reinterpret_cast<jlong>(st);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_deleteInstance(JNIEnv* env, jobject obj, jlong handle) {' >> soundtouch-jni.cpp
          echo '    delete reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    LOGD("SoundTouch instance destroyed");' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Configuration ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setSampleRate(JNIEnv* env, jobject obj, jlong handle, jint sampleRate) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setSampleRate(static_cast<uint>(sampleRate));' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setChannels(JNIEnv* env, jobject obj, jlong handle, jint channels) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setChannels(static_cast<uint>(channels));' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Tempo Control ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setTempo(JNIEnv* env, jobject obj, jlong handle, jfloat tempo) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setTempo(static_cast<double>(tempo));' >> soundtouch-jni.cpp
          echo '    LOGD("Tempo set to %.2f", tempo);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setTempoChange(JNIEnv* env, jobject obj, jlong handle, jfloat tempoDelta) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setTempoChange(static_cast<double>(tempoDelta));' >> soundtouch-jni.cpp
          echo '    LOGD("Tempo change set to %.2f%%", tempoDelta);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Pitch Control ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setPitchSemiTones(JNIEnv* env, jobject obj, jlong handle, jfloat pitch) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setPitchSemiTones(static_cast<double>(pitch));' >> soundtouch-jni.cpp
          echo '    LOGD("Pitch set to %.2f semitones", pitch);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setPitchOctaves(JNIEnv* env, jobject obj, jlong handle, jfloat pitch) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setPitchOctaves(static_cast<double>(pitch));' >> soundtouch-jni.cpp
          echo '    LOGD("Pitch set to %.2f octaves", pitch);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Rate Control ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setRate(JNIEnv* env, jobject obj, jlong handle, jfloat rate) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setRate(static_cast<double>(rate));' >> soundtouch-jni.cpp
          echo '    LOGD("Rate set to %.2f", rate);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setRateChange(JNIEnv* env, jobject obj, jlong handle, jfloat rateDelta) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) st->setRateChange(static_cast<double>(rateDelta));' >> soundtouch-jni.cpp
          echo '    LOGD("Rate change set to %.2f%%", rateDelta);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Streaming Methods ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_putSamples(JNIEnv* env, jobject obj, jlong handle, jshortArray samples, jint numSamples) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (!st) { setError("putSamples: Invalid handle"); return; }' >> soundtouch-jni.cpp
          echo '    jshort* sampleArray = env->GetShortArrayElements(samples, nullptr);' >> soundtouch-jni.cpp
          echo '    if (sampleArray) {' >> soundtouch-jni.cpp
          echo '        st->putSamples(reinterpret_cast<const SAMPLETYPE*>(sampleArray), static_cast<uint>(numSamples));' >> soundtouch-jni.cpp
          echo '        env->ReleaseShortArrayElements(samples, sampleArray, JNI_ABORT);' >> soundtouch-jni.cpp
          echo '    }' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT jint JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_receiveSamples(JNIEnv* env, jobject obj, jlong handle, jshortArray buffer, jint maxSamples) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (!st) { setError("receiveSamples: Invalid handle"); return 0; }' >> soundtouch-jni.cpp
          echo '    jshort* bufferArray = env->GetShortArrayElements(buffer, nullptr);' >> soundtouch-jni.cpp
          echo '    if (!bufferArray) return 0;' >> soundtouch-jni.cpp
          echo '    uint received = st->receiveSamples(reinterpret_cast<SAMPLETYPE*>(bufferArray), static_cast<uint>(maxSamples));' >> soundtouch-jni.cpp
          echo '    env->ReleaseShortArrayElements(buffer, bufferArray, 0);' >> soundtouch-jni.cpp
          echo '    return static_cast<jint>(received);' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT jint JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_numSamples(JNIEnv* env, jobject obj, jlong handle) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    return st ? static_cast<jint>(st->numSamples()) : 0;' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT jboolean JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_isEmpty(JNIEnv* env, jobject obj, jlong handle) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    return st ? st->isEmpty() : JNI_TRUE;' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Buffer Management ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_clear(JNIEnv* env, jobject obj, jlong handle) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) { st->clear(); LOGD("SoundTouch buffers cleared"); }' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_flush(JNIEnv* env, jobject obj, jlong handle) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) { st->flush(); LOGD("SoundTouch flushed"); }' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Settings ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT void JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_setSetting(JNIEnv* env, jobject obj, jlong handle, jint settingId, jint value) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    if (st) { st->setSetting(settingId, value); LOGD("Setting %d set to %d", settingId, value); }' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT jint JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_getSetting(JNIEnv* env, jobject obj, jlong handle, jint settingId) {' >> soundtouch-jni.cpp
          echo '    SoundTouch* st = reinterpret_cast<SoundTouch*>(handle);' >> soundtouch-jni.cpp
          echo '    return st ? st->getSetting(settingId) : 0;' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo '// ========== Utility Methods ==========' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT jstring JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_getVersionString(JNIEnv* env, jclass clazz) {' >> soundtouch-jni.cpp
          echo '    return env->NewStringUTF(SoundTouch::getVersionString());' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
          echo '' >> soundtouch-jni.cpp
          echo 'extern "C" JNIEXPORT jstring JNICALL' >> soundtouch-jni.cpp
          echo 'Java_net_surina_soundtouch_SoundTouch_getErrorString(JNIEnv* env, jclass clazz) {' >> soundtouch-jni.cpp
          echo '    return env->NewStringUTF(g_lastError.c_str());' >> soundtouch-jni.cpp
          echo '}' >> soundtouch-jni.cpp
      
      - name: Build Native Libraries
        run: |
          cd "$SOUNDTOUCH_ROOT/source/Android-lib"
          export PATH=$ANDROID_HOME/ndk/25.1.8937393:$PATH
          rm -rf libs/ obj/
          cd jni
          ndk-build -j4
          cd ..
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "libs/$abi/libsoundtouch.so" ]; then
              echo "✓ $abi/libsoundtouch.so"
              ls -lh "libs/$abi/libsoundtouch.so"
            else
              echo "✗ $abi/libsoundtouch.so not found"
              exit 1
            fi
          done
      
      - name: Generate SoundTouch.java (COMPLETE - ALL METHODS)
        run: |
          mkdir -p output/java/net/surina/soundtouch
          
          echo 'package net.surina.soundtouch;' > output/java/net/surina/soundtouch/SoundTouch.java
          echo '' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '/**' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo ' * Complete SoundTouch Android Wrapper' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo ' * Supports: Tempo, Pitch, Rate control with streaming API' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo ' */' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo 'public final class SoundTouch {' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    ' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    // ========== Native Methods ==========' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private static native long newInstance();' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void deleteInstance(long handle);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setSampleRate(long handle, int sampleRate);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setChannels(long handle, int channels);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setTempo(long handle, float tempo);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setTempoChange(long handle, float tempoDelta);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setPitchSemiTones(long handle, float pitch);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setPitchOctaves(long handle, float pitch);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setRate(long handle, float rate);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setRateChange(long handle, float rateDelta);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void putSamples(long handle, short[] samples, int numSamples);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native int receiveSamples(long handle, short[] buffer, int maxSamples);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native int numSamples(long handle);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native boolean isEmpty(long handle);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void clear(long handle);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void flush(long handle);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native void setSetting(long handle, int settingId, int value);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    private native int getSetting(long handle, int settingId);' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static native String getVersionString();' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static native String getErrorString();' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    // ========== Settings Constants ==========' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static final int SETTING_USE_AA_FILTER = 0;' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static final int SETTING_AA_FILTER_LENGTH = 1;' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static final int SETTING_USE_QUICKSEEK = 2;' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static final int SETTING_SEQUENCE_MS = 3;' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static final int SETTING_SEEKWINDOW_MS = 4;' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '    public static final int SETTING_OVERLAP_MS = 5;' >> output/java/net/surina/soundtouch/SoundTouch.java
          echo '' >> output/java/net/surina/soundtouch/SoundTouch.java
