/**
 * Llama Music Player - Top-level Build Configuration
 * ============================================================================
 * This file configures the build environment for the entire project.
 * It defines the repositories and dependencies for the buildscript itself,
 * not for the application modules.
 * 
 * File Location: /build.gradle
 * 
 * Author: Richard Korbla Adzido
 * Version: 1.0.0
 * Since: 1.0
 */

// Top-level build configuration
buildscript {
    
    /**
     * Repositories for buildscript dependencies.
     * - google(): Google's Maven repository (Android SDK, Support Libraries)
     * - mavenCentral(): Maven Central repository (third-party libraries)
     */
    repositories {
        google()
        mavenCentral()
    }
    
    /**
     * Dependencies for the buildscript classpath.
     * These are used during the build process, not included in the app.
     */
    dependencies {
        // Android Gradle Plugin - version 7.0.4
        // Compatible with Android Studio Arctic Fox | 2020.3.1
        classpath 'com.android.tools.build:gradle:7.0.4'
        
        // Note: App-specific dependencies go in module-level build.gradle files
        // (e.g., app/build.gradle), not here
    }
}

/**
 * Allprojects Configuration
 * ============================================================================
 * These repositories are available to all modules in the project.
 * Any module can access libraries from these repositories.
 */
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

/**
 * Clean Task
 * ============================================================================
 * Deletes the entire build directory of the root project.
 * This is used to perform a clean build.
 */
task clean(type: Delete) {
    delete rootProject.buildDir
}