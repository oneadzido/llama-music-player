name: Build Llama Music Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract Llama.zip
      run: |
        if [ -f "Llama.zip" ]; then
          echo "Found Llama.zip, extracting..."
          unzip -o Llama.zip
          rm Llama.zip
          echo "Extraction complete"
        else
          echo "Llama.zip not found!"
          exit 1
        fi
        
        # If extraction created a folder, move contents up
        if [ -d "Llama" ]; then
          echo "Moving contents from Llama folder to root"
          mv Llama/* .
          mv Llama/.* . 2>/dev/null || true
          rm -rf Llama
        fi
        
        echo "Files after extraction:"
        ls -la
    
    - name: Make gradlew executable
      run: |
        chmod +x gradlew 2>/dev/null || echo "gradlew not found"
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android SDK 34
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
    
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: llama-music-player-apk
        path: app/build/outputs/apk/release/*.apk
