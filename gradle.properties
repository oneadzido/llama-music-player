#
# Llama Music Player - Gradle Properties
# ============================================================================
# This file contains project-wide Gradle settings that affect the build
# performance and behavior of the entire project.
#
# File Location: /gradle.properties
#
# Author: Richard Korbla Adzido
# Version: 1.0.0
# Since: 1.0
#

# ============================================================================
# JVM Configuration
# ============================================================================

# Maximum heap size for the Gradle daemon JVM
# - Xmx2048m: Allocates 2GB of heap memory
# - Dfile.encoding=UTF-8: Sets UTF-8 encoding for file operations
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel execution of tasks
# Improves build performance by running independent tasks in parallel
org.gradle.parallel=true

# Enable the Gradle daemon
# Keeps Gradle running in the background for faster subsequent builds
org.gradle.daemon=true

# Configure on demand
# Only configures projects that are relevant to the requested tasks
org.gradle.configureondemand=true

# ============================================================================
# Android Build Configuration
# ============================================================================

# Enable AndroidX libraries
# AndroidX is the replacement for the original Android Support Library
android.useAndroidX=true

# Enable Jetifier
# Automatically migrates third-party libraries to use AndroidX
android.enableJetifier=true

# ============================================================================
# R8 Code Shrinker Configuration
# ============================================================================

# Disable full mode for R8
# Full mode is more aggressive and may cause issues with reflection
android.enableR8.fullMode=false

# Enable R8 code shrinking and obfuscation
# R8 replaces ProGuard for better performance and optimization
android.enableR8=true